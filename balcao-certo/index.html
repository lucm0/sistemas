deve ser importado duas vezes.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 3/16<\/footer><\/section><section id=\"s3\"><span class=\"kicker\">GUIA 04<\/span><h2>Clientes<\/h2><p>Abra Clientes e cadastre nome e contato. Se usar crediário, informe o limite quando necessário e selecione o cliente antes de concluir a venda.<\/p><aside>Revise os dados pessoais e evite coletar informações que não são necessárias ao atendimento.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 4/16<\/footer><\/section><section id=\"s4\"><span class=\"kicker\">GUIA 05<\/span><h2>Fornecedores<\/h2><p>Abra Fornecedores e cadastre nome, documento, telefone e contato. Use esses registros para organizar as compras e contas a pagar.<\/p><aside>Confira o fornecedor ao importar XML de compra. A importação não confirma automaticamente pagamentos.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 5/16<\/footer><\/section><section id=\"s5\"><span class=\"kicker\">GUIA 06<\/span><h2>Vender (PDV)<\/h2><p>Abra o caixa e entre em Vender. Pesquise um produto ou leia seu código no campo de busca; confirme a variação quando houver. Confira quantidade, preço, desconto e cliente. Abra o pagamento, registre as formas utilizadas e finalize. Imprima o cupom se necessário.<\/p><aside>F2 abre o PDV, F4 ou F10 abre o pagamento e F8 seleciona desconto. Dinheiro pode gerar troco. Pix e cartão são apenas registros: confirme o recebimento no banco ou na maquininha.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 6/16<\/footer><\/section><section id=\"s6\"><span class=\"kicker\">GUIA 07<\/span><h2>Crediário e carnê<\/h2><p>Na venda, selecione o cliente. No pagamento, escolha Crediário / Fiado, informe parcelas e primeiro vencimento. Confira os valores e finalize. Use o carnê para documentar os vencimentos.<\/p><aside>Dê baixa das parcelas recebidas no Financeiro. Imprimir o carnê não significa que o pagamento foi recebido.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 7/16<\/footer><\/section><section id=\"s7\"><span class=\"kicker\">GUIA 08<\/span><h2>Caixa<\/h2><p>Na abertura, informe o fundo de troco e o operador. Registre retiradas como sangria e reforços como suprimento. No fechamento, conte o dinheiro e informe o valor encontrado.<\/p><aside>Compare o valor contado com o esperado e investigue diferenças antes de encerrar. Cartão e Pix não compõem o dinheiro físico da gaveta.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 8/16<\/footer><\/section><section id=\"s8\"><span class=\"kicker\">GUIA 09<\/span><h2>Financeiro<\/h2><p>Cadastre contas a pagar e receber com valor e vencimento. Ao efetuar ou receber um pagamento, registre a baixa e a forma. Consulte fluxo de caixa e resultado gerencial no período escolhido.<\/p><aside>Os demonstrativos são gerenciais e dependem dos lançamentos e custos registrados. Não substituem a escrituração contábil.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 9/16<\/footer><\/section><section id=\"s9\"><span class=\"kicker\">GUIA 10<\/span><h2>Vendas realizadas<\/h2><p>Consulte o histórico, busque vendas e confira itens e pagamentos. Reimprima o cupom quando necessário. Para cancelar, use a ação indicada e confira a confirmação. Para devolver só parte da venda, abra a venda e use <b>Devolver itens<\/b>: escolha as quantidades e se o cliente recebe um <b>vale-compra<\/b> (código impresso, usado como forma de pagamento no caixa) ou dinheiro (sai do caixa aberto).<\/p><aside>Cancelar um registro não devolve dinheiro no banco ou na maquininha. Confira também o estoque e as contas vinculadas após qualquer correção. Vales em aberto ficam em Financeiro; uma venda com devolução não pode mais ser cancelada por inteiro.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 10/16<\/footer><\/section><section id=\"s10\"><span class=\"kicker\">GUIA 11<\/span><h2>Relatórios<\/h2><p>Escolha o período e acompanhe total vendido, ticket médio, produtos, vendedores, formas de pagamento e inventário. Exporte os dados nas telas que oferecem CSV.<\/p><aside>O custo é registrado na venda. Alterar o custo de um produto depois não altera o custo histórico dessa venda.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 11/16<\/footer><\/section><section id=\"s11\"><span class=\"kicker\">GUIA 12<\/span><h2>Ordens de serviço<\/h2><p>Disponível em Assistência e Oficina. Crie uma OS, escolha o cliente e descreva o equipamento ou veículo, defeito e previsão. Acrescente peças e mão de obra, registre diagnóstico e atualize a situação. Use Entregar e cobrar para gerar a venda.<\/p><aside>Revise os termos e a garantia em Configurações antes de imprimir a OS. A mensagem pronta para WhatsApp precisa ser conferida e enviada por você; requer conexão.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 12/16<\/footer><\/section><section id=\"s12\"><span class=\"kicker\">GUIA 13<\/span><h2>Mesas e delivery<\/h2><p>Disponível em Restaurante. Abra uma mesa ou pedido de balcão/delivery, inclua itens e observações. Envie a impressão para cozinha quando necessário. Confira a taxa de entrega ou o serviço opcional ao fechar a conta e finalize o pagamento.<\/p><aside>A cozinha usa impressão local. Pedidos externos são cadastrados manualmente; não há integração com aplicativos de entrega ou sincronização entre aparelhos.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 13/16<\/footer><\/section><section id=\"s13\"><span class=\"kicker\">GUIA 14<\/span><h2>Configurações e impressão<\/h2><p>Confira os dados da empresa, ramo, formas e taxas de pagamento, vendedores e preferências de impressão. Para impressora térmica, selecione 58 ou 80 mm; para folha comum, use A4. Salve as alterações.<\/p><aside>Faça uma prova de impressão e configure o equipamento no computador. Os cupons são não fiscais. Em Produtos, use Etiquetas para selecionar o modelo e as quantidades. Faça uma prova de alinhamento na sua impressora.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 14/16<\/footer><\/section><section id=\"s14\"><span class=\"kicker\">GUIA 15<\/span><h2>Backup e recuperação<\/h2><p>Em Configurações, exporte o backup ao terminar o expediente. Confira o arquivo baixado e guarde outra cópia em local seguro fora do aparelho. Antes de restaurar, exporte uma cópia dos dados atuais; depois selecione o arquivo correto e confirme. No computador, ligue o <b>Backup automático<\/b>: escolha uma pasta (de preferência dentro do OneDrive, Google Drive ou Dropbox) e o sistema grava um arquivo por dia sozinho, ao abrir e ao fechar o caixa.<\/p><aside>Restaurar substitui os dados atuais; não mescla cadastros. Não use navegação privada. Limpar os dados do navegador pode apagar o negócio. Não há backup automático na nuvem nem sincronização entre aparelhos.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 15/16<\/footer><\/section><section id=\"s15\"><span class=\"kicker\">GUIA 16<\/span><h2>Ajuda<\/h2><p>Se a tela não abrir, confira a conexão com a internet e abra o link de novo. Se a licença falhar, copie novamente o código inteiro. Se faltar um cadastro, confira se abriu o mesmo navegador e perfil usados antes.<\/p><aside>Antes de limpar os dados do navegador ou trocar de aparelho, faça backup. Peça ajuda pelo chat da compra informando a tela e a mensagem de erro, sem enviar dados pessoais de clientes.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 16/16<\/footer><\/section><section id=\"salao\"><span class=\"kicker\">SALÃO, BARBEARIA E ESTÉTICA<\/span><h2>Agenda e comissões<\/h2><p>Em Configurações, cadastre os profissionais e seus percentuais de comissão. Em Produtos, escolha Serviço / mão de obra e informe preço e duração. Na Agenda, escolha o dia, clique no horário e selecione cliente, profissional e serviços. Use o lembrete para abrir uma mensagem no WhatsApp e confirmar o envio.<\/p><aside>Salve o agendamento antes de usar Atender e cobrar. A conclusão do pagamento marca o atendimento como atendido. O relatório de comissões considera vendas de atendimentos não canceladas e guarda o percentual usado na cobrança. Alterar a taxa depois não muda as comissões antigas. Faça backup também da agenda.<\/aside><\/section><\/main><\/body><\/html>");w.document.close();}}
</script>
</head>
<body x-data="app()" x-init="iniciar()">

<!-- ═════════════ BOAS-VINDAS (primeira abertura) ═════════════ -->
<template x-if="pronto && !cfg">
  <div class="boas">
    <div class="card">
      <div class="linha" style="gap:12px;margin-bottom:18px">
        <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#14b8a6,#0f766e);display:grid;place-items:center;color:#fff;font-weight:800">BC</div>
        <div><h1>Bem-vindo ao Balcão Certo</h1><div class="muted">Vamos deixar o sistema com a cara do seu negócio. Leva 1 minuto.</div></div>
      </div>
      <template x-if="onb.passo === 1">
        <div class="pilha">
          <button class="btn bloco" @click="onb.passo = 2" data-onb-tenho-codigo>🔑 Já comprei e tenho o código de ativação</button>
          <label class="btn bloco" style="text-align:center">📂 Trocou de computador? Restaurar meus dados de um backup<input type="file" accept=".json" hidden @change="importarBackup($event)" data-onb-restaurar></label>
          <h3>Qual é o seu tipo de negócio?</h3>
          <div class="ramos">
            <template x-for="(r, id) in ramos()" :key="id">
              <button @click="onb.ramo = id" :class="onb.ramo === id && 'on'" :data-ramo="id"><span class="ic" x-text="r.icone"></span><span><b x-text="r.nome"></b></span></button>
            </template>
          </div>
          <div class="small fraco">Dá para trocar depois em Configurações.</div>
          <div class="linha entre"><button class="btn" @click="carregarExemplo(onb.ramo)" data-onb-exemplo>👀 Só quero conhecer (com dados de exemplo)</button><button class="btn pri" @click="onb.passo = 2" data-onb-continuar>Continuar</button></div>
        </div>
      </template>
      <template x-if="onb.passo === 2">
        <div class="pilha">
          <label class="campo"><span class="rot">Nome da empresa (aparece no cupom)</span><input x-model="onb.nome" placeholder="Ex.: Loja da Maria" data-onb-nome @keydown.enter="concluirOnboarding()"></label>
          <label class="campo"><span class="rot">Código de ativação <span class="fraco">(enviado na mensagem da compra — pode colar depois)</span></span><textarea x-model="onb.codigo" @input.debounce.300ms="conferirCodigoOnb()" rows="3" placeholder="Cole aqui o código completo" data-onb-codigo></textarea></label>
          <template x-if="onb.lic && ramos()[onb.lic.ramo]"><div class="aviso azul small" data-onb-edicao><span>✔</span><span x-text="'Código do ' + nomeEdicao(onb.lic.ramo) + ' reconhecido. O sistema já abre pronto para o seu negócio.'"></span></div></template>
          <template x-if="onb.lic && !ramos()[onb.lic.ramo]"><label class="campo"><span class="rot">Tipo de negócio</span><select x-model="onb.ramo"><template x-for="(r, id) in ramos()" :key="id"><option :value="id" x-text="r.icone + ' ' + r.nome"></option></template></select></label></template>
          <div class="aviso azul small" x-show="!onb.lic">Sem o código, o sistema funciona em modo demonstração (até 20 produtos e 30 vendas).</div>
          <div class="vermelho small" x-show="onb.erro" x-text="onb.erro"></div>
          <div class="linha entre"><button class="btn fantasma" @click="onb.passo = 1">Voltar</button><button class="btn pri" @click="concluirOnboarding()" data-onb-concluir>Começar a usar</button></div>
        </div>
      </template>
    </div>
  </div>
</template>

<!-- ═════════════ SISTEMA ═════════════ -->
<template x-if="pronto && cfg">
<div class="app">
  <aside class="side" :class="menuAberto && 'aberto'">
    <div class="marca">
      <div class="logo">BC</div>
      <div><div class="nome" x-text="nomeSistema()">Balcão Certo</div><div class="emp" x-text="cfg.empresa.nome"></div></div>
    </div>
    <nav>
      <template x-for="m in menu()" :key="m.id">
        <a :href="'#' + m.id" :class="rota === m.id && 'ativo'" :data-menu="m.id"><span class="ic" x-text="m.icone"></span><span x-text="m.nome"></span></a>
      </template>
    </nav>
    <div class="rodape">
      <a href="#config" :class="rota === 'config' && 'ativo'" data-menu="config">⚙️ Configurações</a>
      <a href="#manual" onclick="BCabrirManual(event)" target="_blank">📖 Manual de uso</a>
      <div class="tiny" style="color:#8fa0b8;padding:4px" x-text="licenciado() ? 'Licença ativa' : 'Modo demonstração'"></div>
    </div>
  </aside>

  <div class="main">
    <div class="topo">
      <button class="btn fantasma burger" @click="menuAberto = !menuAberto">☰</button>
      <div class="b" x-text="(menu().find(m => m.id === rota) || {nome: 'Configurações'}).nome"></div>
      <div class="espaco"></div>
      <template x-if="caixaAberto()"><span class="selo verde esconde-mob" x-text="'Caixa aberto desde ' + dataHora(caixaAberto().abertura).slice(11)"></span></template>
      <template x-if="!caixaAberto()"><button class="btn peq esconde-mob" @click="abrirCaixaModal()">💵 Abrir caixa</button></template>
      <button class="btn pri peq" @click="ir('pdv')">🛒 Vender <span class="kbd">F2</span></button>
    </div>

    <div class="conteudo">
      <template x-if="window.BC_DEMO_ONLINE">
        <div class="aviso amarelo" style="margin-bottom:14px"><span>ℹ️</span><span class="espaco">Demonstração online: a impressão e o backup em arquivo ficam desligados aqui. No sistema instalado no computador, os dois funcionam.</span></div>
      </template>
      <template x-if="cfg.exemplo">
        <div class="aviso azul" style="margin-bottom:14px"><span>👀</span><span class="espaco">Você está vendo dados de exemplo. Pode vender, cadastrar e mexer à vontade. Para começar de verdade, apague tudo em Configurações.</span><a class="btn peq" href="#config">Começar de verdade</a></div>
      </template>
      <template x-if="!licenciado() && !cfg.exemplo">
        <div class="aviso amarelo" style="margin-bottom:14px"><span>🔑</span><span class="espaco">Modo demonstração: até 20 produtos e 30 vendas. Ative com o código da sua compra.</span><a class="btn peq" href="#config">Ativar agora</a></div>
      </template>
      <template x-if="novaVersao && rota === 'inicio'">
        <div class="aviso azul" style="margin-bottom:14px"><span>⬆️</span><span class="espaco" x-text="'Nova versão ' + novaVersao + ' disponível (você usa a ' + versao + '). Baixe e instale por cima: seus dados continuam.'"></span><a class="btn peq" :href="urlInstalar" target="_blank" rel="noopener">Baixar</a><button class="btn peq fantasma" @click="novaVersao = null">Depois</button></div>
      </template>
      <template x-if="mostrarAvaliacao() && rota === 'inicio'">
        <div class="aviso amarelo" style="margin-bottom:14px"><span>⭐</span><span class="espaco">Está gostando do sistema? Uma avaliação na sua compra no Mercado Livre ajuda muito a gente. Se algo não ficou bom, responda a mensagem da compra — a gente resolve.</span><a class="btn peq" :href="urlAvaliar" target="_blank" rel="noopener" @click="marcarAvaliacao()">Avaliar</a><button class="btn peq fantasma" @click="marcarAvaliacao()">Já avaliei</button><button class="btn peq fantasma" @click="adiarAvaliacao()">Agora não</button></div>
      </template>
      <template x-if="mostrarConviteBackup() && rota === 'inicio'">
        <div class="aviso azul" style="margin-bottom:14px"><span>🛡️</span><span class="espaco">Proteja seus dados: escolha uma pasta (OneDrive, Google Drive, Dropbox) e o sistema grava um backup por dia sozinho.</span><button class="btn peq" @click="escolherPastaBackup()">Escolher pasta de backup</button><button class="btn peq fantasma" @click="adiarConviteBackup()">Depois</button></div>
      </template>
      <template x-if="backupAuto.erro === 'reautorizar' && rota === 'inicio'">
        <div class="aviso amarelo" style="margin-bottom:14px"><span>💾</span><span class="espaco" x-text="'O navegador pede sua confirmação para continuar gravando o backup automático em “' + backupAuto.pasta + '”.'"></span><button class="btn peq" @click="reautorizarPastaBackup()">Autorizar</button></div>
      </template>
      <template x-if="temDados() && diasSemBackup() >= 7 && rota === 'inicio'">
        <div class="aviso vermelho" style="margin-bottom:14px"><span>💾</span><span class="espaco" x-text="cfg.backupEm ? 'Seu último backup foi há ' + diasSemBackup() + ' dias. Os dados ficam só neste aparelho.' : 'Você ainda não fez nenhum backup. Os dados ficam só neste aparelho.'"></span><button class="btn peq" @click="exportarBackup()">Fazer backup agora</button></div>
      </template>

      <template x-if="mostrarConviteCurso()">
        <aside class="card pad convite-curso" data-convite-curso aria-label="Convite para o curso">
          <div><h2>Quer um sistema feito sob medida para o seu negócio?</h2><p class="muted">Aprenda a fazer o seu com IA.</p></div>
          <div class="linha"><a class="btn" :href="linkCurso()" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" data-curso-link>Conhecer o curso</a><button class="btn fantasma" @click="dispensarCurso()" data-curso-dispensar>Não mostrar de novo</button></div>
        </aside>
      </template>

      <!-- ─────────── INÍCIO ─────────── -->
      <template x-if="rota === 'inicio'">
        <div x-data="{ p: painel() }" x-effect="p = painel()">
          <div class="cab"><div><h1 x-text="'Olá! ' + cfg.empresa.nome"></h1><p class="muted" x-text="new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })"></p></div></div>
          <div class="grid g4">
            <div class="card kpi destaque"><div class="rot">Vendido hoje</div><div class="val" x-text="brl(p.hojeTotal)"></div><div class="sub" x-text="p.hojeQtd + ' vendas · ticket médio ' + brl(p.hojeTicket)"></div></div>
            <div class="card kpi"><div class="rot">Lucro de hoje</div><div class="val verde" x-text="brl(p.hojeLucro)"></div><div class="sub">depois do custo e das taxas de cartão</div></div>
            <div class="card kpi"><div class="rot">Vendido no mês</div><div class="val" x-text="brl(p.mesTotal)"></div><div class="sub" x-text="'lucro ' + brl(p.mesLucro)"></div></div>
            <div class="card kpi"><div class="rot">A receber vencido</div><div class="val" :class="p.receberVencido ? 'vermelho' : ''" x-text="brl(p.receberVencido)"></div><div class="sub" x-text="'a pagar em 7 dias: ' + brl(p.pagarSemana)"></div></div>
          </div>
          <div class="grid g2" style="margin-top:14px">
            <div class="card pad">
              <div class="linha entre"><h2>Atalhos</h2></div>
              <div class="grid g2">
                <button class="btn grande pri" @click="ir('pdv')">🛒 Nova venda</button>
                <template x-if="ramo().os"><button class="btn grande" @click="ir('os'); $nextTick(() => abrirOS(null))">📋 Nova OS</button></template>
                <template x-if="ramo().mesas"><button class="btn grande" @click="ir('mesas')">🍽️ Mesas e delivery</button></template>
                <button class="btn grande" @click="ir('produtos'); $nextTick(() => abrirProduto(null))">📦 Novo produto</button>
                <button class="btn grande" @click="ir('clientes'); $nextTick(() => abrirCliente(null))">👥 Novo cliente</button>
                <button class="btn grande" @click="ir('financeiro'); $nextTick(() => abrirConta('pagar'))">💸 Lançar despesa</button>
              </div>
              <template x-if="ramo().os">
                <div class="linha" style="margin-top:12px"><span class="selo azul" x-text="p.osAbertas + ' OS em andamento'"></span><span class="selo verde" x-text="p.osProntas + ' prontas para entregar'"></span></div>
              </template>
              <template x-if="ramo().mesas"><div class="linha" style="margin-top:12px"><span class="selo amarelo" x-text="p.mesasAbertas + ' comandas abertas'"></span></div></template>
            </div>
            <div class="card pad">
              <div class="linha entre"><h2>Estoque baixo</h2><a class="small" href="#produtos" @click="filtro.estoque = 'baixo'">ver todos</a></div>
              <template x-if="!p.baixo.length"><div class="vazio" style="padding:20px">✅ Nenhum produto abaixo do mínimo.</div></template>
              <table class="tab" x-show="p.baixo.length"><tbody>
                <template x-for="pr in p.baixo" :key="pr.id"><tr><td x-text="pr.nome"></td><td class="num vermelho b" x-text="qtd(estoqueTotal(pr)) + ' ' + pr.unidade"></td><td class="num fraco small" x-text="'mín. ' + qtd(pr.minimo)"></td></tr></template>
              </tbody></table>
              <template x-if="aniversariantes().length">
                <div style="margin-top:12px"><h3>🎂 Aniversariantes de hoje</h3>
                  <template x-for="c in aniversariantes()" :key="c.id"><div class="linha entre"><span x-text="c.nome"></span><a class="btn peq" target="_blank" :href="whats(c.telefone, 'Feliz aniversário, ' + c.nome.split(' ')[0] + '! 🎉 A ' + cfg.empresa.nome + ' deseja um ótimo dia!')">WhatsApp</a></div></template>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- ─────────── PDV ─────────── -->
      <template x-if="rota === 'pdv'">
        <div class="pdv">
          <div class="pilha">
            <div class="pdv-busca">
              <input id="pdv-busca" x-model="pdv.busca" @input="buscarPdv()" @keydown.enter.prevent="enterPdv()" @keydown.arrow-down.prevent="pdv.sel = Math.min(pdv.sel + 1, pdv.sugestoes.length - 1)" @keydown.arrow-up.prevent="pdv.sel = Math.max(pdv.sel - 1, 0)" placeholder="Código de barras, código ou nome do produto (3*código = 3 unidades)" autocomplete="off">
              <div class="sugestoes" x-show="pdv.sugestoes.length" @click.outside="pdv.sugestoes = []">
                <template x-for="(s, k) in pdv.sugestoes" :key="s.p.id + '-' + (s.v ? s.v.id : 0)">
                  <div class="item" :class="k === pdv.sel && 'on'" @click="adicionarItem(s.p, s.v); pdv.busca = ''; pdv.sugestoes = []">
                    <span><b x-text="s.p.nome"></b><span x-show="s.v" x-text="' (' + (s.v ? s.v.nome : '') + ')'"></span> <span class="fraco small" x-text="s.p.codigo"></span></span>
                    <span class="nowrap"><span class="fraco small" x-show="s.p.tipo !== 'servico' && s.p.controlaEstoque !== false" x-text="'estoque ' + qtd(s.v ? s.v.estoque : s.p.estoque) + '  '"></span><b x-text="brl(s.p.preco)"></b></span>
                  </div>
                </template>
              </div>
            </div>
            <div class="card pdv-itens">
              <table class="tab">
                <thead><tr><th>#</th><th>Produto</th><th class="c">Qtd</th><th class="r">Unit.</th><th class="r">Total</th><th></th></tr></thead>
                <tbody>
                  <template x-for="(i, k) in pdv.itens" :key="i.uid">
                    <tr>
                      <td class="fraco" x-text="k + 1"></td>
                      <td x-text="i.nome"></td>
                      <td class="c"><div class="qtd"><button @click="alterarQtd(i, -1)">−</button><input :value="qtd(i.qtd)" @change="i.qtd = Math.max(0.001, num($event.target.value)); alterarQtd(i, 0)"><button @click="alterarQtd(i, 1)">+</button></div></td>
                      <td class="num"><input style="width:90px;text-align:right;padding:4px 6px" :value="n2(i.preco)" @change="i.preco = num($event.target.value)"></td>
                      <td class="num b" x-text="n2(i.qtd * i.preco)"></td>
                      <td><button class="btn fantasma peq" @click="removerItem(i)" title="Remover">✕</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <template x-if="!pdv.itens.length"><div class="vazio"><div class="grande">🛒</div>Passe o leitor de código de barras ou digite o nome do produto.</div></template>
            </div>
            <div class="atalhos"><span><span class="kbd">Enter</span> adicionar / finalizar</span><span><span class="kbd">↑ ↓</span> escolher</span><span><span class="kbd">F4</span> pagamento</span><span><span class="kbd">F8</span> desconto</span><span><span class="kbd">Esc</span> fechar</span></div>
          </div>
          <div class="pilha">
            <div class="total-box">
              <div class="rot">Total da venda</div>
              <div class="valor" x-text="brl(totalPdv())"></div>
              <div class="small" style="color:#9fb0c8" x-text="pdv.itens.length + ' itens · subtotal ' + brl(subtotalPdv()) + (descontoPdv() ? ' · desconto ' + brl(descontoPdv()) : '') + (pdv.acrescimo ? ' · ' + pdv.acrescimoRotulo + ' ' + brl(pdv.acrescimo) : '')"></div>
            </div>
            <div class="card pad pilha">
              <label class="campo"><span class="rot">Cliente <span class="fraco">(obrigatório para fiado)</span></span>
                <div class="linha" style="flex-wrap:nowrap"><select x-model.number="pdv.clienteId"><option value="">Consumidor final</option><template x-for="c in clientesFiltrados()" :key="c.id"><option :value="c.id" x-text="c.nome"></option></template></select><button class="btn peq" @click="abrirCliente(null); form._voltar = 'pdv'" title="Novo cliente">＋</button></div>
              </label>
              <div class="grid g2">
                <label class="campo"><span class="rot">Desconto (R$ ou %)</span><input id="pdv-desconto" x-model="pdv.desconto" placeholder="ex.: 5 ou 10%" inputmode="decimal"></label>
                <label class="campo" x-show="cfg.vendedores.length"><span class="rot" x-text="ramo().agenda ? 'Profissional' : 'Vendedor'"></span><select x-model="pdv.vendedor"><option value="">—</option><template x-for="v in cfg.vendedores" :key="v"><option x-text="v"></option></template></select></label>
              </div>
              <label class="campo"><span class="rot">Observação</span><input x-model="pdv.obs"></label>
              <button class="btn pri grande bloco" @click="abrirPagamento()" :disabled="!pdv.itens.length" data-pdv-pagar>Receber pagamento <span class="kbd">F4</span></button>
              <button class="btn perigo bloco" @click="cancelarPdv()" x-show="pdv.itens.length">Cancelar venda</button>
            </div>
          </div>
        </div>
      </template>

      <!-- ─────────── MESAS / DELIVERY ─────────── -->
      <template x-if="rota === 'mesas'">
        <div>
          <div class="cab"><div><h1>Mesas e delivery</h1><p class="muted">Clique numa mesa para abrir ou continuar a comanda.</p></div>
            <div class="linha"><button class="btn" @click="novoDelivery('balcao')">🥡 Pedido balcão</button><button class="btn pri" @click="novoDelivery('delivery')">🛵 Novo delivery</button></div></div>
          <div class="comanda">
            <div class="pilha">
              <div class="card pad">
                <h2>Mesas</h2>
                <div class="mesas">
                  <template x-for="n in mesas()" :key="n">
                    <div class="mesa" :class="{ ocupada: comandaDaMesa(n), atual: comandaAtual && comandaAtual.tipo === 'mesa' && comandaAtual.mesa === n }" @click="abrirMesa(n)" :data-mesa="n">
                      <div class="n" x-text="n"></div>
                      <template x-if="comandaDaMesa(n)"><div class="small"><b x-text="brl(totalComanda(comandaDaMesa(n)))"></b><div class="fraco tiny" x-text="minutos(comandaDaMesa(n).abertaEm) + ' min'"></div></div></template>
                      <template x-if="!comandaDaMesa(n)"><div class="small fraco">livre</div></template>
                    </div>
                  </template>
                </div>
              </div>
              <div class="card pad">
                <h2>Delivery e balcão em aberto</h2>
                <template x-if="!deliveriesAbertos().length"><div class="fraco">Nenhum pedido aberto.</div></template>
                <table class="tab" x-show="deliveriesAbertos().length"><tbody>
                  <template x-for="c in deliveriesAbertos()" :key="c.id">
                    <tr class="clicavel" @click="comandaAtual = c"><td><span class="selo" :class="c.tipo === 'delivery' ? 'azul' : 'cinza'" x-text="c.tipo === 'delivery' ? 'Delivery' : 'Balcão'"></span> <b x-text="'nº ' + c.numero"></b></td><td x-text="c.cliente || '—'"></td><td class="fraco small" x-text="minutos(c.abertaEm) + ' min'"></td><td class="num b" x-text="brl(totalComanda(c) + num(c.taxaEntrega))"></td></tr>
                  </template>
                </tbody></table>
              </div>
            </div>
            <div class="card pad pilha" style="position:sticky;top:70px">
              <template x-if="!comandaAtual"><div class="vazio"><div class="grande">🍽️</div>Escolha uma mesa ou abra um pedido.</div></template>
              <template x-if="comandaAtual">
                <div class="pilha">
                  <div class="linha entre"><h2 style="margin:0" x-text="comandaAtual.tipo === 'mesa' ? 'Mesa ' + comandaAtual.mesa : (comandaAtual.tipo === 'delivery' ? 'Delivery nº ' + comandaAtual.numero : 'Balcão nº ' + comandaAtual.numero)"></h2><button class="x" @click="comandaAtual = null">×</button></div>
                  <template x-if="comandaAtual.tipo !== 'mesa'">
                    <div class="grid g2">
                      <label class="campo"><span class="rot">Cliente</span><input x-model="comandaAtual.cliente" @change="salvar('comandas')" list="lista-clientes" @input="const c = clientes.find(x => x.nome === comandaAtual.cliente); if (c) { comandaAtual.clienteId = c.id; comandaAtual.telefone = c.telefone; comandaAtual.endereco = c.endereco; }"></label>
                      <label class="campo"><span class="rot">Telefone</span><input x-model="comandaAtual.telefone" @change="salvar('comandas')"></label>
                      <template x-if="comandaAtual.tipo === 'delivery'"><label class="campo" style="grid-column:span 2"><span class="rot">Endereço de entrega</span><input x-model="comandaAtual.endereco" @change="salvar('comandas')"></label></template>
                      <template x-if="comandaAtual.tipo === 'delivery'"><label class="campo"><span class="rot">Taxa de entrega</span><input x-model="comandaAtual.taxaEntrega" inputmode="decimal" @change="salvar('comandas')"></label></template>
                    </div>
                  </template>
                  <div class="busca"><input id="busca-comanda" x-model="buscaComanda" @input="buscarComanda()" @keydown.enter.prevent="enterComanda()" placeholder="Buscar item do cardápio"></div>
                  <template x-if="sugComanda.length"><div class="card"><template x-for="p in sugComanda" :key="p.id"><div class="linha entre" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f2f6" @click="addComanda(p)"><span x-text="p.nome"></span><b x-text="brl(p.preco)"></b></div></template></div></template>
                  <table class="tab">
                    <tbody>
                      <template x-for="i in comandaAtual.itens" :key="i.uid">
                        <tr>
                          <td style="width:70px"><div class="linha" style="flex-wrap:nowrap;gap:2px"><button class="btn peq fantasma" @click="i.qtd = Math.max(1, i.qtd - 1); salvar('comandas')">−</button><b x-text="i.qtd"></b><button class="btn peq fantasma" @click="i.qtd++; salvar('comandas')">+</button></div></td>
                          <td><div x-text="i.nome"></div><input class="small" style="padding:3px 6px;margin-top:3px" placeholder="observação (sem cebola…)" x-model="i.obs" @change="salvar('comandas')" :disabled="i.enviado"><span x-show="i.enviado" class="tiny verde">✓ na cozinha</span></td>
                          <td class="num" x-text="n2(i.qtd * i.preco)"></td>
                          <td><button class="btn fantasma peq" @click="removerComanda(i)">✕</button></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="linha entre b" style="font-size:18px"><span>Total</span><span x-text="brl(totalComanda(comandaAtual) + (comandaAtual.tipo === 'delivery' ? num(comandaAtual.taxaEntrega) : 0))"></span></div>
                  <div class="grid g2">
                    <button class="btn" @click="enviarCozinha()">👨‍🍳 Enviar à cozinha</button>
                    <button class="btn" @click="imprimirComanda()">🖨️ Imprimir conta</button>
                  </div>
                  <template x-if="comandaAtual.tipo === 'mesa'">
                    <div class="grid g2"><button class="btn pri" @click="fecharComanda(true)" x-text="'Fechar com ' + cfg.taxaServico + '%'"></button><button class="btn ok" @click="fecharComanda(false)">Fechar sem serviço</button></div>
                  </template>
                  <template x-if="comandaAtual.tipo !== 'mesa'"><button class="btn pri bloco" @click="fecharComanda(false)">Receber e fechar</button></template>
                  <div class="linha entre">
                    <template x-if="comandaAtual.tipo === 'mesa'"><div class="linha" x-data="{ nova: '' }"><input style="width:80px" x-model="nova" placeholder="mesa"><button class="btn peq" @click="transferirMesa(nova)">Transferir</button></div></template>
                    <button class="btn perigo peq" @click="cancelarComanda()">Cancelar comanda</button>
                  </div>
                  <details><summary class="small muted" style="cursor:pointer">Ver cardápio completo</summary>
                    <template x-for="[cat, itens] in cardapio()" :key="cat"><div style="margin-top:10px"><div class="small b muted" x-text="cat"></div><div class="cardapio" style="margin-top:6px"><template x-for="p in itens" :key="p.id"><button @click="addComanda(p)"><template x-if="p.foto"><img :src="p.foto" class="foto-card"></template><div x-text="p.nome"></div><b class="small" x-text="brl(p.preco)"></b></button></template></div></div></template>
                  </details>
                </div>
              </template>
            </div>
          </div>
          <datalist id="lista-clientes"><template x-for="c in clientes" :key="c.id"><option :value="c.nome"></option></template></datalist>
        </div>
      </template>

      <!-- ─────────── ORDENS DE SERVIÇO ─────────── -->
      <template x-if="rota === 'os'">
        <div>
          <div class="cab"><div><h1>Ordens de serviço</h1><p class="muted">Entrada, orçamento, aprovação, execução e entrega — com aviso por WhatsApp.</p></div><button class="btn pri" @click="abrirOS(null)" data-os-nova>＋ Nova OS</button></div>
          <div class="linha" style="margin-bottom:12px">
            <div class="abas"><button :class="filtro.os === 'abertas' && 'on'" @click="filtro.os = 'abertas'">Em andamento</button><template x-for="s in ['Aguardando aprovação', 'Pronta', 'Entregue']" :key="s"><button :class="filtro.os === s && 'on'" @click="filtro.os = s" x-text="s"></button></template><button :class="filtro.os === 'todas' && 'on'" @click="filtro.os = 'todas'">Todas</button></div>
            <div class="espaco"></div><div class="busca" style="width:280px"><input x-model="busca.os" placeholder="Nº, cliente, aparelho, placa…"></div>
          </div>
          <div class="card rolagem">
            <table class="tab">
              <thead><tr><th>Nº</th><th>Entrada</th><th>Cliente</th><th x-text="ramo().os === 'veiculo' ? 'Veículo' : 'Equipamento'"></th><th>Situação</th><th class="r">Total</th><th></th></tr></thead>
              <tbody>
                <template x-for="o in osFiltradas()" :key="o.id">
                  <tr class="clicavel" @click="abrirOS(o)">
                    <td class="b" x-text="o.numero"></td><td class="small" x-text="data(o.data)"></td><td x-text="nomeCliente(o.clienteId)"></td>
                    <td x-text="ramo().os === 'veiculo' ? [o.veiculo.modelo, o.veiculo.placa].filter(Boolean).join(' — ') : [o.equipamento.tipo, o.equipamento.marca, o.equipamento.modelo].filter(Boolean).join(' ')"></td>
                    <td><span class="selo" :class="corStatus(o.status)" x-text="o.status"></span></td>
                    <td class="num b" x-text="brl(o.total)"></td>
                    <td class="nowrap" @click.stop><a class="btn peq" target="_blank" :href="whats((cliente(o.clienteId) || {}).telefone, msgOS(o))" title="Avisar no WhatsApp">💬</a> <button class="btn peq" @click="imprimirOS(o)" title="Imprimir">🖨️</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="!osFiltradas().length"><div class="vazio"><div class="grande">📋</div>Nenhuma ordem de serviço aqui.</div></template>
          </div>
        </div>
      </template>

      <!-- ─────────── PRODUTOS ─────────── -->
      <template x-if="rota === 'produtos'">
        <div>
          <div class="cab"><div><h1 x-text="ramo().os ? 'Peças, produtos e serviços' : 'Produtos e estoque'"></h1><p class="muted" x-text="inventario().itens + ' itens · ' + qtd(inventario().pecas) + ' unidades · estoque vale ' + brl(inventario().custo) + ' (custo) / ' + brl(inventario().venda) + ' (venda)'"></p></div>
            <div class="linha">
              <label class="btn">📄 Importar XML da nota<input type="file" accept=".xml" hidden @change="importarXML($event)"></label>
              <label class="btn">⬆️ Importar planilha<input type="file" accept=".csv,.txt" hidden @change="importarProdutosCSV($event)"></label>
              <button class="btn" @click="abrirEtiquetas()" data-etiquetas>🏷️ Etiquetas</button>
              <button class="btn" @click="exportarCSV('produtos')">⬇️ Exportar</button>
              <button class="btn pri" @click="abrirProduto(null)" data-produto-novo>＋ Novo produto</button>
            </div></div>
          <div class="linha" style="margin-bottom:12px">
            <div class="abas"><button :class="filtro.estoque === 'todos' && 'on'" @click="filtro.estoque = 'todos'">Todos</button><button :class="filtro.estoque === 'baixo' && 'on'" @click="filtro.estoque = 'baixo'">Estoque baixo</button><button :class="filtro.estoque === 'servicos' && 'on'" @click="filtro.estoque = 'servicos'">Serviços</button></div>
            <div class="espaco"></div><div class="busca" style="width:300px"><input x-model="busca.produtos" placeholder="Nome, código, código de barras…"></div>
          </div>
          <div class="card rolagem">
            <table class="tab">
              <thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th class="r">Custo</th><th class="r">Preço</th><th class="r">Margem</th><th class="r">Estoque</th><th></th></tr></thead>
              <tbody>
                <template x-for="p in produtosFiltrados()" :key="p.id">
                  <tr class="clicavel" @click="abrirProduto(p)">
                    <td class="mono small" x-text="p.codigo"></td>
                    <td><template x-if="p.foto"><img :src="p.foto" class="mini"></template><b x-text="p.nome"></b><div class="tiny fraco" x-show="p.barras" x-text="p.barras"></div><div class="tiny fraco" x-show="p.variacoes && p.variacoes.length" x-text="(p.variacoes || []).length + ' variações'"></div></td>
                    <td class="small muted" x-text="p.categoria"></td>
                    <td class="num" x-text="n2(p.custo)"></td><td class="num b" x-text="n2(p.preco)"></td>
                    <td class="num small" :class="margem(p) < 15 ? 'laranja' : 'verde'" x-text="p.preco ? margem(p).toFixed(0) + '%' : '—'"></td>
                    <td class="num"><template x-if="p.tipo === 'servico' || p.controlaEstoque === false"><span class="fraco">—</span></template><template x-if="p.tipo !== 'servico' && p.controlaEstoque !== false"><span :class="estoqueBaixo(p) ? 'selo vermelho' : ''" x-text="qtd(estoqueTotal(p)) + ' ' + p.unidade"></span></template></td>
                    <td @click.stop><button class="btn peq" @click="ajustarEstoque(p)" x-show="p.tipo !== 'servico' && p.controlaEstoque !== false">± Estoque</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="!produtosFiltrados().length"><div class="vazio"><div class="grande">📦</div>Nenhum produto. Cadastre, importe uma planilha ou o XML da nota de compra.</div></template>
          </div>
        </div>
      </template>

      <!-- ─────────── CLIENTES ─────────── -->
      <template x-if="rota === 'clientes'">
        <div>
          <div class="cab"><div><h1>Clientes</h1><p class="muted" x-text="clientesFiltrados().length + ' clientes cadastrados'"></p></div><div class="linha"><button class="btn" @click="exportarCSV('clientes')">⬇️ Exportar</button><button class="btn pri" @click="abrirCliente(null)">＋ Novo cliente</button></div></div>
          <div class="linha" style="margin-bottom:12px"><div class="busca" style="width:320px"><input x-model="busca.clientes" placeholder="Nome, telefone, CPF…"></div></div>
          <div class="card rolagem">
            <table class="tab">
              <thead><tr><th>Nome</th><th>Telefone</th><th>CPF/CNPJ</th><th class="r">Em aberto</th><th class="r">Limite</th><th></th></tr></thead>
              <tbody>
                <template x-for="c in clientesFiltrados()" :key="c.id">
                  <tr class="clicavel" @click="abrirCliente(c)">
                    <td class="b"><template x-if="c.foto"><img :src="c.foto" class="mini"></template><span x-text="c.nome"></span></td><td x-text="c.telefone"></td><td class="small muted" x-text="c.doc"></td>
                    <td class="num" :class="saldoDevedor(c.id) ? 'vermelho b' : 'fraco'" x-text="brl(saldoDevedor(c.id))"></td>
                    <td class="num small muted" x-text="c.limite ? brl(c.limite) : '—'"></td>
                    <td @click.stop><a class="btn peq" target="_blank" :href="whats(c.telefone, '')" x-show="c.telefone">💬</a></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="!clientesFiltrados().length"><div class="vazio"><div class="grande">👥</div>Nenhum cliente ainda.</div></template>
          </div>
        </div>
      </template>

      <!-- ─────────── FORNECEDORES ─────────── -->
      <template x-if="rota === 'fornecedores'">
        <div>
          <div class="cab"><div><h1>Fornecedores</h1></div><button class="btn pri" @click="abrirFornecedor(null)">＋ Novo fornecedor</button></div>
          <div class="linha" style="margin-bottom:12px"><div class="busca" style="width:320px"><input x-model="busca.fornecedores" placeholder="Buscar…"></div></div>
          <div class="card rolagem">
            <table class="tab"><thead><tr><th>Nome</th><th>Contato</th><th>Telefone</th><th>CPF/CNPJ</th></tr></thead>
              <tbody><template x-for="f in fornecedoresFiltrados()" :key="f.id"><tr class="clicavel" @click="abrirFornecedor(f)"><td class="b" x-text="f.nome"></td><td x-text="f.contato"></td><td x-text="f.telefone"></td><td class="small muted" x-text="f.doc"></td></tr></template></tbody>
            </table>
            <template x-if="!fornecedoresFiltrados().length"><div class="vazio">Nenhum fornecedor.</div></template>
          </div>
        </div>
      </template>

      <!-- ─────────── CAIXA ─────────── -->
      <template x-if="rota === 'caixa'">
        <div>
          <div class="cab"><div><h1>Caixa</h1><p class="muted">Abertura, sangria, reforço e fechamento com conferência do dinheiro.</p></div></div>
          <template x-if="!caixaAberto()">
            <div class="card pad c" style="padding:40px"><div style="font-size:40px">💵</div><h2>O caixa está fechado</h2><p class="muted">Abra o caixa com o valor do troco para começar a vender.</p><button class="btn pri grande" @click="abrirCaixaModal()" data-caixa-abrir>Abrir caixa</button></div>
          </template>
          <template x-if="caixaAberto()">
            <div x-data="{ r: resumoCaixa(caixaAberto()) }" x-effect="r = resumoCaixa(caixaAberto())">
              <div class="grid g4">
                <div class="card kpi destaque"><div class="rot">Vendido neste caixa</div><div class="val" x-text="brl(r.total)"></div><div class="sub" x-text="r.vendas + ' vendas'"></div></div>
                <div class="card kpi"><div class="rot">Dinheiro esperado na gaveta</div><div class="val" x-text="brl(r.esperadoDinheiro)"></div><div class="sub" x-text="'troco inicial ' + brl(caixaAberto().valorInicial)"></div></div>
                <div class="card kpi"><div class="rot">Sangrias</div><div class="val" x-text="brl(r.sangrias)"></div></div>
                <div class="card kpi"><div class="rot">Reforços</div><div class="val" x-text="brl(r.reforcos)"></div></div>
                <div class="card kpi" x-show="r.devolucoes"><div class="rot">Devoluções em dinheiro</div><div class="val vermelho" x-text="brl(r.devolucoes)"></div></div>
              </div>
              <div class="grid g2" style="margin-top:14px">
                <div class="card pad"><h2>Por forma de pagamento</h2>
                  <table class="tab"><tbody><template x-for="[f, v] in Object.entries(r.porForma)" :key="f"><tr><td x-text="nomeForma(f)"></td><td class="num b" x-text="brl(v)"></td></tr></template></tbody></table>
                  <template x-if="!Object.keys(r.porForma).length"><div class="fraco">Nenhuma venda ainda.</div></template>
                </div>
                <div class="card pad pilha"><h2>Ações</h2>
                  <button class="btn bloco" @click="movCaixaModal('sangria')">➖ Sangria (retirar dinheiro)</button>
                  <button class="btn bloco" @click="movCaixaModal('suprimento')">➕ Reforço (colocar troco)</button>
                  <button class="btn pri bloco" @click="fecharCaixaModal()" data-caixa-fechar>🔒 Fechar caixa</button>
                  <template x-if="caixaAberto().movs.length"><table class="tab small"><tbody><template x-for="m in caixaAberto().movs" :key="m.data"><tr><td x-text="dataHora(m.data).slice(11)"></td><td x-text="m.tipo === 'sangria' ? 'Sangria' : 'Reforço'"></td><td x-text="m.motivo"></td><td class="num" x-text="brl(m.valor)"></td></tr></template></tbody></table></template>
                </div>
              </div>
            </div>
          </template>
          <div class="card" style="margin-top:14px"><div style="padding:14px 16px"><h2 style="margin:0">Caixas anteriores</h2></div>
            <table class="tab"><thead><tr><th>Abertura</th><th>Fechamento</th><th>Operador</th><th class="r">Vendido</th><th class="r">Diferença</th><th></th></tr></thead>
              <tbody><template x-for="cx in caixas.filter(c => c.fechamento).slice().reverse().slice(0, 30)" :key="cx.id"><tr><td x-text="dataHora(cx.abertura)"></td><td x-text="dataHora(cx.fechamento)"></td><td x-text="cx.operador"></td><td class="num" x-text="brl(cx.resumo ? cx.resumo.total : 0)"></td><td class="num" :class="Math.abs(cx.valorContado - cx.esperado) > 0.009 ? 'vermelho b' : 'verde'" x-text="brl(cx.valorContado - cx.esperado)"></td><td><button class="btn peq" @click="imprimirFechamento(cx)">🖨️</button></td></tr></template></tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- ─────────── FINANCEIRO ─────────── -->
      <template x-if="rota === 'financeiro'">
        <div x-data="{ aba: 'contas' }">
          <div class="cab"><div><h1>Financeiro</h1><p class="muted">Contas a pagar e a receber, fluxo de caixa e resultado (DRE).</p></div>
            <div class="linha"><button class="btn" @click="abrirConta('receber')">＋ Conta a receber</button><button class="btn pri" @click="abrirConta('pagar')">＋ Despesa / conta a pagar</button></div></div>
          <template x-if="valesAbertos().length"><div class="card pad" style="margin-bottom:14px"><h2>🎟️ Vales-compra em aberto</h2>
            <table class="tab"><thead><tr><th>Código</th><th>Cliente</th><th>Emitido</th><th class="r">Saldo</th><th></th></tr></thead><tbody>
              <template x-for="va in valesAbertos()" :key="va.id"><tr><td class="b mono" x-text="va.codigo"></td><td x-text="nomeCliente(va.clienteId) || '—'"></td><td class="small" x-text="dataHora(va.criadoEm)"></td><td class="num b" x-text="brl(va.saldo)"></td><td class="r"><button class="btn peq" @click="imprimirVale(va)">Imprimir</button> <button class="btn peq fantasma" @click="cancelarVale(va)">Cancelar</button></td></tr></template>
            </tbody></table></div></template>
          <div class="grid g4" style="margin-bottom:14px">
            <div class="card kpi"><div class="rot">A receber (em aberto)</div><div class="val" x-text="brl(totalContas('receber'))"></div><div class="sub vermelho" x-text="'vencido ' + brl(totalContas('receber', 'vencidas'))"></div></div>
            <div class="card kpi"><div class="rot">A pagar (em aberto)</div><div class="val" x-text="brl(totalContas('pagar'))"></div><div class="sub vermelho" x-text="'vencido ' + brl(totalContas('pagar', 'vencidas'))"></div></div>
            <div class="card kpi"><div class="rot">A pagar nos próximos 7 dias</div><div class="val" x-text="brl(totalContas('pagar', 'semana'))"></div></div>
            <div class="card kpi"><div class="rot">Lucro líquido no período</div><div class="val" :class="dre().lucro >= 0 ? 'verde' : 'vermelho'" x-text="brl(dre().lucro)"></div><div class="sub" x-text="data(periodo.de) + ' a ' + data(periodo.ate)"></div></div>
          </div>
          <div class="linha" style="margin-bottom:12px"><div class="abas"><button :class="aba === 'contas' && 'on'" @click="aba = 'contas'">Contas</button><button :class="aba === 'fluxo' && 'on'" @click="aba = 'fluxo'">Fluxo de caixa</button><button :class="aba === 'dre' && 'on'" @click="aba = 'dre'" data-aba-dre>Resultado (DRE)</button></div></div>

          <template x-if="aba === 'contas'">
            <div>
              <div class="linha" style="margin-bottom:10px"><div class="abas"><button :class="filtro.contasTipo === 'receber' && 'on'" @click="filtro.contasTipo = 'receber'">A receber</button><button :class="filtro.contasTipo === 'pagar' && 'on'" @click="filtro.contasTipo = 'pagar'">A pagar</button></div>
                <div class="abas"><template x-for="[k, n] in [['abertas', 'Em aberto'], ['vencidas', 'Vencidas'], ['pagas', 'Pagas'], ['todas', 'Todas']]" :key="k"><button :class="filtro.contas === k && 'on'" @click="filtro.contas = k" x-text="n"></button></template></div></div>
              <div class="card rolagem">
                <table class="tab"><thead><tr><th>Vencimento</th><th>Descrição</th><th x-text="filtro.contasTipo === 'receber' ? 'Cliente' : 'Fornecedor / categoria'"></th><th class="r">Valor</th><th>Situação</th><th></th></tr></thead>
                  <tbody><template x-for="c in contasFiltradas()" :key="c.id">
                    <tr>
                      <td class="nowrap" :class="!c.pagoEm && c.vencimento < hojeISO() ? 'vermelho b' : ''" x-text="data(c.vencimento)"></td>
                      <td><span x-text="c.descricao"></span></td>
                      <td class="small muted" x-text="c.tipo === 'receber' ? nomeCliente(c.clienteId) : (nomeFornecedor(c.fornecedorId) || c.categoria)"></td>
                      <td class="num b" x-text="brl(c.valor)"></td>
                      <td><template x-if="c.pagoEm"><span class="selo verde" x-text="(c.tipo === 'receber' ? 'Recebido ' : 'Pago ') + data(c.pagoEm)"></span></template><template x-if="!c.pagoEm"><span class="selo" :class="c.vencimento < hojeISO() ? 'vermelho' : 'amarelo'" x-text="c.vencimento < hojeISO() ? 'Vencida' : 'Em aberto'"></span></template></td>
                      <td class="nowrap"><template x-if="!c.pagoEm"><span><button class="btn peq ok" @click="abrirBaixa(c)" x-text="c.tipo === 'receber' ? 'Receber' : 'Pagar'"></button> <button class="btn peq fantasma" @click="abrirConta(c.tipo, c)">✏️</button> <a class="btn peq fantasma" x-show="c.tipo === 'receber' && (cliente(c.clienteId) || {}).telefone" target="_blank" :href="whats((cliente(c.clienteId) || {}).telefone, 'Olá! Lembrete da ' + cfg.empresa.nome + ': a parcela de ' + brl(c.valor) + ' vence em ' + data(c.vencimento) + '.')">💬</a></span></template><template x-if="c.pagoEm"><button class="btn peq fantasma" @click="estornarConta(c)">Desfazer</button></template></td>
                    </tr></template></tbody>
                </table>
                <template x-if="!contasFiltradas().length"><div class="vazio">Nada por aqui.</div></template>
              </div>
            </div>
          </template>

          <template x-if="aba !== 'contas'">
            <div class="linha" style="margin-bottom:10px">
              <div class="abas"><template x-for="[k, n] in [['hoje', 'Hoje'], ['mes', 'Este mês'], ['mesPassado', 'Mês passado'], ['30', '30 dias'], ['ano', 'Este ano']]" :key="k"><button @click="periodoRapido(k)" x-text="n"></button></template></div>
              <input type="date" x-model="periodo.de" style="width:auto"><span class="muted">até</span><input type="date" x-model="periodo.ate" style="width:auto">
            </div>
          </template>
          <template x-if="aba === 'fluxo'">
            <div class="card rolagem"><table class="tab"><thead><tr><th>Dia</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Saldo do período</th></tr></thead>
              <tbody><template x-for="d in fluxo()" :key="d.dia"><tr><td x-text="data(d.dia)"></td><td class="num verde" x-text="brl(d.entradas)"></td><td class="num vermelho" x-text="brl(d.saidas)"></td><td class="num b" :class="d.saldo < 0 ? 'vermelho' : ''" x-text="brl(d.saldo)"></td></tr></template></tbody></table>
              <template x-if="!fluxo().length"><div class="vazio">Sem movimento no período.</div></template>
              <div class="small fraco" style="padding:10px 14px">Entradas = vendas recebidas na hora + parcelas recebidas. Vendas no crediário entram quando a parcela é paga.</div>
            </div>
          </template>
          <template x-if="aba === 'dre'">
            <div class="card pad" style="max-width:640px" x-data="{ d: dre() }" x-effect="d = dre()">
              <h2>Resultado do período</h2>
              <table class="tab">
                <tbody>
                  <tr><td>Receita bruta de vendas <span class="fraco small" x-text="'(' + d.vendas + ' vendas)'"></span></td><td class="num" x-text="brl(d.bruta)"></td></tr>
                  <tr><td>(−) Descontos concedidos</td><td class="num vermelho" x-text="brl(-d.descontos)"></td></tr>
                  <tr x-show="d.devolucoes"><td>(−) Devoluções</td><td class="num vermelho" x-text="brl(-d.devolucoes)"></td></tr>
                  <tr class="b"><td>= Receita líquida</td><td class="num" x-text="brl(d.liquida)"></td></tr>
                  <tr><td>(−) Custo das mercadorias vendidas</td><td class="num vermelho" x-text="brl(-d.cmv)"></td></tr>
                  <tr><td>(−) Taxas de cartão</td><td class="num vermelho" x-text="brl(-d.taxas)"></td></tr>
                  <tr class="b"><td>= Lucro bruto</td><td class="num" x-text="brl(d.bruto)"></td></tr>
                  <template x-for="[cat, v] in Object.entries(d.porCat)" :key="cat"><tr><td x-text="'(−) ' + cat"></td><td class="num vermelho" x-text="brl(-v)"></td></tr></template>
                  <tr class="b" style="font-size:16px"><td>= Lucro líquido</td><td class="num" :class="d.lucro >= 0 ? 'verde' : 'vermelho'" x-text="brl(d.lucro)"></td></tr>
                  <tr><td class="muted">Margem líquida</td><td class="num muted" x-text="d.margem.toFixed(1) + '%'"></td></tr>
                </tbody>
              </table>
              <div class="small fraco" style="margin-top:8px">Despesas entram pela data de vencimento. Compras de mercadoria não entram aqui — o custo já aparece em "custo das mercadorias vendidas".</div>
            </div>
          </template>
        </div>
      </template>

      <!-- ─────────── VENDAS REALIZADAS ─────────── -->
      <template x-if="rota === 'vendas'">
        <div>
          <div class="cab"><div><h1>Vendas realizadas</h1></div><button class="btn" @click="exportarCSV('vendas')">⬇️ Exportar</button></div>
          <div class="linha" style="margin-bottom:12px">
            <div class="abas"><template x-for="[k, n] in [['hoje', 'Hoje'], ['mes', 'Este mês'], ['mesPassado', 'Mês passado'], ['30', '30 dias']]" :key="k"><button @click="periodoRapido(k)" x-text="n"></button></template></div>
            <input type="date" x-model="periodo.de" style="width:auto"><span class="muted">até</span><input type="date" x-model="periodo.ate" style="width:auto">
            <div class="espaco"></div><div class="busca" style="width:260px"><input x-model="busca.vendas" placeholder="Nº, cliente, produto…"></div>
          </div>
          <div class="card rolagem">
            <table class="tab"><thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Itens</th><th>Pagamento</th><th class="r">Total</th><th></th></tr></thead>
              <tbody><template x-for="v in vendasFiltradas()" :key="v.id">
                <tr class="clicavel" @click="verVenda(v)" :style="v.cancelada ? 'opacity:.5' : ''">
                  <td class="b"><span x-text="v.numero"></span><span class="selo amarelo tiny" x-show="(v.devolucoes || []).length" style="margin-left:6px">↩️ devolução</span></td><td class="small nowrap" x-text="dataHora(v.data)"></td><td x-text="nomeCliente(v.clienteId) || '—'"></td>
                  <td class="small" x-text="v.itens.length + ' itens: ' + v.itens.slice(0, 2).map(i => i.nome).join(', ') + (v.itens.length > 2 ? '…' : '')"></td>
                  <td class="small" x-text="v.pagamentos.map(p => nomeForma(p.forma)).join(' + ')"></td>
                  <td class="num b" x-text="brl(v.total)"></td>
                  <td><span class="selo vermelho" x-show="v.cancelada">Cancelada</span></td>
                </tr></template></tbody>
            </table>
            <template x-if="!vendasFiltradas().length"><div class="vazio">Nenhuma venda no período.</div></template>
          </div>
        </div>
      </template>

      <!-- ─────────── RELATÓRIOS ─────────── -->
      <template x-if="rota === 'relatorios'">
        <div x-data="{ r: resumoPeriodo() }" x-effect="periodo.de; periodo.ate; vendas.length; r = resumoPeriodo()">
          <div class="cab"><div><h1>Relatórios</h1></div></div>
          <div class="linha" style="margin-bottom:12px">
            <div class="abas"><template x-for="[k, n] in [['hoje', 'Hoje'], ['mes', 'Este mês'], ['mesPassado', 'Mês passado'], ['30', '30 dias'], ['ano', 'Este ano']]" :key="k"><button @click="periodoRapido(k)" x-text="n"></button></template></div>
            <input type="date" x-model="periodo.de" style="width:auto"><span class="muted">até</span><input type="date" x-model="periodo.ate" style="width:auto">
          </div>
          <div class="grid g4">
            <div class="card kpi destaque"><div class="rot">Faturamento</div><div class="val" x-text="brl(r.total)"></div><div class="sub" x-text="r.qtd + ' vendas'"></div></div>
            <div class="card kpi"><div class="rot">Ticket médio</div><div class="val" x-text="brl(r.ticket)"></div></div>
            <div class="card kpi"><div class="rot">Lucro bruto</div><div class="val verde" x-text="brl(r.lucro)"></div><div class="sub" x-text="'margem ' + r.margem.toFixed(1) + '%'"></div></div>
            <div class="card kpi"><div class="rot">Estoque (preço de custo)</div><div class="val" x-text="brl(inventario().custo)"></div><div class="sub" x-text="qtd(inventario().pecas) + ' unidades'"></div></div>
            <div class="card kpi" x-show="r.devolucoes"><div class="rot">Devoluções</div><div class="val vermelho" x-text="brl(r.devolucoes)"></div><div class="sub" x-text="r.qtdDevolucoes + ' no período · vales em aberto: ' + brl(valesAbertos().reduce((s, v) => s + v.saldo, 0))"></div></div>
          </div>
          <template x-if="ramo().agenda"><div class="card pad"><h2>Comissão por profissional</h2><template x-for="v in comissaoProfissionais()" :key="v.nome"><div class="linha entre"><b x-text="v.nome"></b><span x-text="v.qtd + ' atendimentos · vendas ' + brl(v.total)"></span><strong x-text="brl(v.comissao)"></strong></div></template><p class="muted small" x-show="!comissaoProfissionais().length">Sem atendimentos cobrados neste período.</p></div></template>
          <div class="card pad" style="margin-top:14px"><h2>Vendas por dia</h2>
            <div class="barras"><template x-for="d in porDia()" :key="d.dia"><div class="bar" :style="'height:' + Math.max(2, d.pct) + '%'" :data-tip="data(d.dia) + ': ' + brl(d.total)"></div></template></div>
            <template x-if="!porDia().length"><div class="fraco">Sem vendas no período.</div></template>
          </div>
          <div class="grid g2" style="margin-top:14px">
            <div class="card"><div style="padding:14px 16px"><h2 style="margin:0">Produtos mais vendidos</h2></div>
              <table class="tab"><thead><tr><th>Produto</th><th class="r">Qtd</th><th class="r">Total</th><th class="r">Lucro</th></tr></thead><tbody><template x-for="p in rankingProdutos()" :key="p.nome"><tr><td x-text="p.nome"></td><td class="num" x-text="qtd(p.qtd)"></td><td class="num b" x-text="brl(p.total)"></td><td class="num verde" x-text="brl(p.lucro)"></td></tr></template></tbody></table>
            </div>
            <div class="pilha">
              <div class="card"><div style="padding:14px 16px"><h2 style="margin:0">Por forma de pagamento</h2></div><table class="tab"><tbody><template x-for="f in porForma()" :key="f.forma"><tr><td x-text="nomeForma(f.forma)"></td><td class="num b" x-text="brl(f.valor)"></td></tr></template></tbody></table></div>
              <div class="card"><div style="padding:14px 16px"><h2 style="margin:0">Por vendedor</h2></div><table class="tab"><tbody><template x-for="v in porVendedor()" :key="v.nome"><tr><td x-text="v.nome"></td><td class="num" x-text="v.qtd + ' vendas'"></td><td class="num b" x-text="brl(v.total)"></td></tr></template></tbody></table></div>
            </div>
          </div>
        </div>
      </template>

      <template x-if="rota === 'agenda'">
        <div class="pilha">
          <div class="cab"><div><h1>Agenda de atendimentos</h1><p class="muted">Horários, serviços e profissionais do seu salão.</p></div><button class="btn pri" @click="abrirAgenda(null)" data-agenda-nova>＋ Agendar</button></div>
          <div class="linha"><label class="campo"><span class="rot">Dia</span><input type="date" x-model="diaAgenda"></label><label class="campo"><span class="rot">Intervalo</span><select x-model="cfg.intervaloAgenda" @change="salvarCfg()"><option value="15">15 minutos</option><option value="30">30 minutos</option><option value="60">60 minutos</option></select></label></div>
          <div class="card pad" x-show="!profissionais().length">Cadastre os profissionais em <a href="#config">Configurações</a> para começar.</div>
          <div class="agenda-rolagem" x-show="profissionais().length">
            <table class="tab agenda-grade"><thead><tr><th>Horário</th><template x-for="p in profissionais()" :key="p"><th x-text="p"></th></template></tr></thead><tbody>
              <template x-for="h in horariosAgenda()" :key="h"><tr><th x-text="h"></th><template x-for="p in profissionais()" :key="p"><td>
                <template x-for="a in agendaHorario(h,p)" :key="a.id"><button class="agenda-item" @click="abrirAgenda(a)"><b x-text="a.hora + ' · ' + nomeCliente(a.clienteId)"></b><span x-text="a.servicos.map(s=>s.nome).join(', ')"></span><small x-text="a.status + ' · ' + a.duracaoMin + ' min'"></small></button></template>
                <span class="small muted" x-show="horarioOcupado(h,p)">Em atendimento</span>
                <button class="btn peq" x-show="!horarioOcupado(h,p) && !agendaHorario(h,p).some(a=>!['cancelado','faltou'].includes(a.status))" @click="abrirAgenda(null,h,p)" :aria-label="'Agendar ' + h + ' com ' + p">＋</button>
              </td></template></tr></template>
            </tbody></table>
          </div>
        </div>
      </template>

      <!-- ─────────── CONFIGURAÇÕES ─────────── -->
      <template x-if="rota === 'config'">
        <div class="pilha" style="max-width:900px">
          <div class="cab"><div><h1>Configurações</h1></div><button class="btn pri" @click="salvarCfg()">Salvar</button></div>
          <div class="card pad">
            <h2>🔑 Licença</h2>
            <template x-if="licenciado()"><div><span class="selo verde">Ativa</span> <span class="muted small" x-text="'Pedido ' + licenca.pedido + (licenca.nome ? ' — ' + licenca.nome : '') + ' · ativada em ' + data(licenca.ativadoEm)"></span></div></template>
            <template x-if="!licenciado()"><div class="pilha"><div class="muted">Cole o código de ativação que enviamos na mensagem da sua compra.</div><textarea x-model="codigoLicenca" rows="3" data-cfg-codigo></textarea><div class="vermelho small" x-show="erroLicenca" x-text="erroLicenca"></div><div><button class="btn pri" @click="ativar()" data-cfg-ativar>Ativar</button></div></div></template>
          </div>
          <div class="card pad">
            <h2>🏪 Empresa</h2>
            <div class="form-grid">
              <label class="campo s8"><span class="rot">Nome / razão social</span><input x-model="cfg.empresa.nome"></label>
              <label class="campo s4"><span class="rot">CPF / CNPJ</span><input x-model="cfg.empresa.doc"></label>
              <label class="campo s6"><span class="rot">Endereço</span><input x-model="cfg.empresa.endereco"></label>
              <label class="campo s3"><span class="rot">Cidade</span><input x-model="cfg.empresa.cidade"></label>
              <label class="campo s3"><span class="rot">Telefone / WhatsApp</span><input x-model="cfg.empresa.telefone"></label>
              <div class="s12 linha"><template x-if="cfg.empresa.logo"><img :src="cfg.empresa.logo" style="max-height:50px;border:1px solid var(--bd);border-radius:6px"></template><label class="btn peq">🖼️ Escolher logotipo<input type="file" accept="image/*" hidden @change="carregarLogo($event)"></label><button class="btn peq fantasma" x-show="cfg.empresa.logo" @click="cfg.empresa.logo = ''">remover</button></div>
            </div>
          </div>
          <div class="card pad">
            <h2>🧩 Tipo de negócio</h2>
            <select x-model="cfg.negocio" @change="salvarCfg()" :disabled="!!edicao()" data-cfg-ramo><template x-for="(r, id) in ramos()" :key="id"><option :value="id" x-text="r.icone + ' ' + r.nome"></option></template></select>
            <p class="small muted" x-show="edicao()" x-text="'Seu código de ativação é do ' + nomeSistema() + '. O tipo de negócio acompanha a edição comprada.'"></p>
            <div class="form-grid" style="margin-top:12px">
              <template x-if="ramo().mesas"><label class="campo s4"><span class="rot">Número de mesas</span><input type="number" min="1" max="200" x-model.number="cfg.numMesas"></label></template>
              <template x-if="ramo().mesas"><label class="campo s4"><span class="rot">Taxa de serviço (%)</span><input type="number" min="0" max="30" x-model.number="cfg.taxaServico"></label></template>
              <template x-if="ramo().mesas"><label class="campo s4"><span class="rot">Taxa de entrega padrão (R$)</span><input inputmode="decimal" :value="n2(cfg.taxaEntrega || 0)" @change="cfg.taxaEntrega = num($event.target.value)"></label></template>
              <template x-if="ramo().os"><label class="campo s4"><span class="rot">Garantia padrão (dias)</span><input type="number" min="0" x-model.number="cfg.garantiaDias"></label></template>
              <template x-if="ramo().os"><label class="campo s12"><span class="rot">Termo impresso na OS</span><textarea x-model="cfg.termoOS" rows="4"></textarea></label></template>
            </div>
          </div>
          <div class="card pad">
            <h2>💳 Formas de pagamento e taxas</h2>
            <table class="tab"><thead><tr><th>Forma</th><th class="r">Taxa (%)</th></tr></thead><tbody>
              <template x-for="p in cfg.pagamentos" :key="p.id"><tr><td><input x-model="p.nome" :disabled="['dinheiro', 'crediario'].includes(p.id)"></td><td style="width:140px"><input inputmode="decimal" :value="String(p.taxa).replace('.', ',')" @change="p.taxa = num($event.target.value)"></td></tr></template>
            </tbody></table>
            <button class="btn peq" style="margin-top:8px" @click="addPagamento()">＋ Forma de pagamento</button>
            <div class="small fraco" style="margin-top:6px">A taxa da maquininha é descontada no cálculo do lucro.</div>
          </div>
          <div class="card pad">
            <h2 x-text="ramo().agenda ? '✂️ Profissionais e senha do gerente' : '👤 Vendedores e senha do gerente'"></h2>
            <div class="form-grid">
              <label class="campo s8"><span class="rot" x-text="ramo().agenda ? 'Profissionais (separe por vírgula)' : 'Vendedores (separe por vírgula)'"></span><input :value="cfg.vendedores.join(', ')" @change="cfg.vendedores = [...new Set($event.target.value.split(',').map(s => s.trim()).filter(Boolean))]"></label>
              <label class="campo s4"><span class="rot">Senha do gerente</span><input type="password" x-model="cfg.senhaAdmin" placeholder="sem senha" autocomplete="new-password"></label>
              <div class="s12 small fraco">A senha é pedida para cancelar venda, excluir produto, apagar lançamento e restaurar backup.</div>
            </div>
          </div>
          <template x-if="ramo().agenda"><div class="card pad"><h2>Comissões por profissional</h2><p class="small muted">Percentual sobre o total da venda de atendimento. A taxa é guardada na cobrança e vendas canceladas não entram.</p><template x-for="p in profissionais()" :key="p"><label class="campo"><span class="rot" x-text="p + ' (%)'"></span><input inputmode="decimal" :value="cfg.comissoes[p] || 0" @change="cfg.comissoes[p] = Math.max(0,Math.min(100,num($event.target.value)))"></label></template></div></template>

            <h2>🖨️ Impressão</h2>

              <label class="campo s4"><span class="rot">Papel</span><select x-model="cfg.impressao.largura"><option value="80">Térmica 80 mm</option><option value="58">Térmica 58 mm</option><option value="A4">Folha A4</option></select></label>
              <label class="campo s8"><span class="rot">Mensagem no rodapé do cupom</span><input x-model="cfg.impressao.rodape"></label>
            </div>
          </div>
          <div class="card pad">
            <h2>💾 Backup</h2>
            <p class="muted small">Os dados ficam guardados neste aparelho. Faça backup toda semana e guarde o arquivo no pen drive, no e-mail ou no Google Drive. Para usar em outro computador, faça o backup aqui e restaure lá.</p>
            <div class="linha"><button class="btn pri" @click="exportarBackup()">⬇️ Fazer backup agora</button><label class="btn">⬆️ Restaurar backup<input type="file" accept=".json" hidden @change="importarBackup($event)"></label><span class="small fraco" x-text="cfg.backupEm ? 'Último backup: ' + dataHora(cfg.backupEm) : 'Nenhum backup feito ainda.'"></span></div>

              <h3>Backup automático</h3>
              <template x-if="!backupAuto.suporte"><p class="muted small">Neste navegador não dá para gravar numa pasta sozinho. No computador, use o sistema instalado (Windows ou Mac) ou o Chrome/Edge — e, no celular, continue com o backup manual.</p></template>
              <template x-if="backupAuto.suporte && !backupAuto.pasta"><div class="linha"><button class="btn" @click="escolherPastaBackup()">📁 Escolher pasta de backup</button><span class="small muted">Um arquivo por dia, ao abrir o sistema e ao fechar o caixa. Escolha uma pasta do OneDrive, Google Drive ou Dropbox e o backup vai para a nuvem sozinho.</span></div></template>
              <template x-if="backupAuto.suporte && backupAuto.pasta"><div class="linha"><span class="selo verde">Ligado</span><span class="small" x-text="'Pasta: ' + backupAuto.pasta + (cfg.backupAuto && cfg.backupAuto.ultimo ? ' · último: ' + dataHora(cfg.backupAuto.ultimo) : ' · ainda não gravou')"></span><span class="small vermelho" x-show="backupAuto.erro && backupAuto.erro !== 'reautorizar'" x-text="backupAuto.erro"></span><button class="btn peq" x-show="backupAuto.erro === 'reautorizar'" @click="reautorizarPastaBackup()">Autorizar pasta</button><button class="btn peq" @click="backupAutomatico('clique')">Gravar agora</button><button class="btn peq fantasma" @click="escolherPastaBackup()">Trocar pasta</button><button class="btn peq fantasma" @click="desativarBackupAuto()">Desligar</button></div></template>
            </div>
          </div>
          <div class="card pad"><h2 class="vermelho">Zona de perigo</h2><button class="btn perigo" @click="apagarTudo()">Apagar todos os dados</button></div>
          <div class="small fraco c"><span x-text="nomeSistema()"></span> · <span x-text="'versão ' + versao"></span> · dados neste aparelho (<span x-text="BCDB.modo"></span>)</div>
        </div>
      </template>
    </div>
  </div>
</div>
</template>

        <label class="campo s3" x-show="form.tipo === 'produto'"><span class="rot">Estoque mínimo</span><input x-model="form.minimo" inputmode="decimal"></label>

      <template x-if="form.tipo === 'produto' && (ramo().grade || (form.variacoes && form.variacoes.length))">

          <h3>Grade (tamanho / cor)</h3>

          <table class="tab" x-show="form.variacoes.length" style="margin-top:8px"><thead><tr><th>Variação</th><th>Código de barras</th><th class="r">Estoque</th><th></th></tr></thead><tbody>

          </tbody></table>
        </div>

    <div class="mrod"><template x-if="form.id"><button class="btn perigo" @click="excluirProduto(produtos.find(p => p.id === form.id))">Excluir</button></template><div class="espaco"></div><button class="btn" @click="fecharModal()">Cancelar</button><button class="btn pri" @click="salvarProduto()" data-f-salvar>Salvar</button></div>

<template x-if="modal === 'pagamento'">

    <div class="mcorpo pilha">
      <div class="linha entre"><span class="muted">Total</span><span style="font-size:28px;font-weight:800" x-text="brl(totalPdv())"></span></div>
      <div class="pag-formas"><template x-for="f in cfg.pagamentos" :key="f.id"><button :class="pag.forma === f.id && 'on'" @click="pag.forma = f.id" x-text="f.nome" :data-forma="f.id"></button></template><button :class="pag.forma === 'vale' && 'on'" @click="pag.forma = 'vale'" data-forma="vale" x-show="valesAbertos().length">🎟️ Vale-compra</button></div>
      <template x-if="pag.forma === 'vale'"><label class="campo"><span class="rot">Código do vale (impresso no vale)</span><input x-model="pag.valeCodigo" placeholder="VALE-0001" data-pag-vale @keydown.enter.prevent="adicionarPagamento()" style="text-transform:uppercase"><span class="small muted" x-show="valePorCodigo(pag.valeCodigo)" x-text="valePorCodigo(pag.valeCodigo) ? 'Saldo disponível: ' + brl(valePorCodigo(pag.valeCodigo).saldo) : ''"></span></label></template>
      <div class="grid g2">
        <label class="campo"><span class="rot">Valor recebido nesta forma</span><input id="pag-valor" x-model="pag.valor" inputmode="decimal" @keydown.enter.prevent="faltaPdv() > 0.001 ? adicionarPagamento() : finalizarVenda()" style="font-size:18px;font-weight:700"></label>
        <template x-if="pag.forma === 'crediario'"><div class="grid g2"><label class="campo"><span class="rot">Parcelas</span><input type="number" min="1" max="24" x-model.number="pag.parcelas"></label><label class="campo"><span class="rot">1º vencimento</span><input type="date" x-model="pag.primeiroVenc"></label></div></template>
      </div>
      <button class="btn bloco" @click="adicionarPagamento()" x-show="faltaPdv() > 0.001">＋ Adicionar esta forma (pagar com mais de uma)</button>
      <template x-if="pag.linhas.length"><table class="tab"><tbody><template x-for="(l, k) in pag.linhas" :key="k"><tr><td x-text="nomeForma(l.forma) + (l.parcelas > 1 ? ' (' + l.parcelas + 'x)' : '')"></td><td class="num b" x-text="brl(l.valor)"></td><td><button class="btn fantasma peq" @click="pag.linhas.splice(k, 1); pag.valor = n2s(faltaPdv())">✕</button></td></tr></template></tbody></table></template>

    </div>
    <div class="mrod"><button class="btn" @click="fecharModal()">Voltar</button><button id="pag-finalizar" class="btn pri grande" @click="finalizarVenda()" data-pag-finalizar>Concluir venda</button></div>
  </div></div>
</template>
