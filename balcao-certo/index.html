<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balcão Certo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EBC%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f766e">
<style>
/* Balcão Certo — estilos. Sem framework: tokens + componentes. */
:root {
  --bg: #f4f6f9; --card: #ffffff; --tx: #17202e; --tx2: #5b6678; --tx3: #8a94a6;
  --bd: #e3e7ee; --bd2: #cfd6e1;
  --pri: #0f766e; --pri2: #0d5f59; --pri-bg: #e6f4f2;
  --ok: #15803d; --ok-bg: #e8f6ec; --err: #b91c1c; --err-bg: #fdecec; --warn: #b45309; --warn-bg: #fff4e0;
  --azul: #1d4ed8; --azul-bg: #e8efff;
  --raio: 10px; --sombra: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --side: 236px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--tx); -webkit-font-smoothing: antialiased; }
[x-cloak] { display: none !important; }
a { color: var(--pri); text-decoration: none; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 16px; margin: 0 0 10px; }
h3 { font-size: 14px; margin: 0 0 8px; }
.muted { color: var(--tx2); } .fraco { color: var(--tx3); } .small { font-size: 12px; } .tiny { font-size: 11px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.b { font-weight: 600; } .c { text-align: center; } .r { text-align: right; } .nowrap { white-space: nowrap; }
.verde { color: var(--ok); } .vermelho { color: var(--err); } .laranja { color: var(--warn); }

/* Layout */
.app { display: flex; min-height: 100vh; }
.side { width: var(--side); background: #0f1b2d; color: #c9d3e3; position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; z-index: 30; }
.side .marca { padding: 18px 18px 14px; display: flex; align-items: center; gap: 10px; color: #fff; }
.side .marca .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #14b8a6, #0f766e); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.side .marca .nome { font-weight: 700; font-size: 15px; line-height: 1.1; }
.side .marca .emp { font-size: 11px; color: #8fa0b8; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side nav { flex: 1; overflow-y: auto; padding: 6px 10px; }
.side nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: #c9d3e3; font-size: 13.5px; margin-bottom: 2px; }
.side nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.side nav a.ativo { background: rgba(20, 184, 166, .16); color: #fff; font-weight: 600; }
.side nav a .ic { width: 20px; text-align: center; }
.side .rodape { padding: 12px 14px; border-top: 1px solid rgba(255, 255, 255, .08); font-size: 12px; }
.side .rodape a { color: #c9d3e3; display: block; padding: 6px 4px; }
.main { flex: 1; margin-left: var(--side); min-width: 0; }
.topo { position: sticky; top: 0; z-index: 20; background: rgba(244, 246, 249, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--bd); padding: 10px 24px; display: flex; align-items: center; gap: 12px; }
.topo .burger { display: none; }
.conteudo { padding: 20px 24px 60px; max-width: 1400px; }
.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.cab p { margin: 4px 0 0; }

/* Componentes */
.card { background: var(--card); border: 1px solid var(--bd); border-radius: var(--raio); box-shadow: var(--sombra); }
.card.pad { padding: 16px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { padding: 14px 16px; }
.kpi .rot { font-size: 12px; color: var(--tx2); }
.kpi .val { font-size: 24px; font-weight: 700; margin-top: 4px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--tx3); margin-top: 2px; }
.kpi.destaque { background: linear-gradient(135deg, #0f766e, #115e59); color: #fff; border: 0; }
.kpi.destaque .rot, .kpi.destaque .sub { color: rgba(255, 255, 255, .8); }
.linha { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.linha.entre { justify-content: space-between; }
.espaco { flex: 1; }
.pilha > * + * { margin-top: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--bd2); background: #fff; color: var(--tx); padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: #f6f8fb; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
.btn.pri:hover { background: var(--pri2); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.perigo { color: var(--err); border-color: #f2c4c4; }
.btn.perigo:hover { background: var(--err-bg); }
.btn.fantasma { border-color: transparent; background: transparent; }
.btn.fantasma:hover { background: rgba(15, 23, 42, .05); }
.btn.peq { padding: 5px 10px; font-size: 12.5px; }
.btn.grande { padding: 13px 18px; font-size: 16px; }
.btn.bloco { width: 100%; }
.btn .kbd, .kbd { font-size: 10.5px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: rgba(0, 0, 0, .08); }
.btn.pri .kbd { background: rgba(255, 255, 255, .22); }

.abas { display: inline-flex; background: #e9edf3; padding: 3px; border-radius: 9px; gap: 2px; flex-wrap: wrap; }
.abas button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font: inherit; font-size: 13px; font-weight: 600; color: var(--tx2); cursor: pointer; }
.abas button.on { background: #fff; color: var(--tx); box-shadow: var(--sombra); }

label.campo { display: block; font-size: 12.5px; color: var(--tx2); font-weight: 500; }
label.campo > span.rot { display: block; margin-bottom: 4px; }
input, select, textarea { font: inherit; color: var(--tx); border: 1px solid var(--bd2); border-radius: 8px; padding: 8px 10px; background: #fff; width: 100%; outline: none; transition: border-color .12s, box-shadow .12s; }
input:focus, select:focus, textarea:focus { border-color: var(--pri); box-shadow: 0 0 0 3px rgba(15, 118, 110, .15); }
input[type=checkbox] { width: auto; }
textarea { min-height: 70px; resize: vertical; }
.busca { position: relative; }
.busca input { padding-left: 34px; }
.busca::before { content: "🔍"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: .55; }

table.tab { width: 100%; border-collapse: collapse; }
table.tab th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--tx3); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--bd); background: #fafbfd; position: sticky; top: 0; }
table.tab td { padding: 10px 12px; border-bottom: 1px solid #eef1f5; vertical-align: middle; }
table.tab tr:last-child td { border-bottom: 0; }
table.tab tbody tr:hover td { background: #fafcff; }
table.tab tr.clicavel { cursor: pointer; }
.rolagem { overflow: auto; }
.vazio { padding: 36px 16px; text-align: center; color: var(--tx3); }
.vazio .grande { font-size: 34px; margin-bottom: 6px; }

.selo { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.selo.verde { background: var(--ok-bg); color: var(--ok); } .selo.vermelho { background: var(--err-bg); color: var(--err); }
.selo.amarelo { background: var(--warn-bg); color: var(--warn); } .selo.azul { background: var(--azul-bg); color: var(--azul); }
.selo.cinza { background: #eef1f5; color: var(--tx2); } .selo.roxo { background: #f1eaff; color: #6d28d9; }
.selo.ciano { background: #e0f7fa; color: #0e7490; } .selo.laranja { background: #ffedd5; color: #c2410c; }

.aviso { padding: 10px 14px; border-radius: 9px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
.aviso.amarelo { background: var(--warn-bg); color: #7c3d06; border: 1px solid #f5d9a8; }
.aviso.azul { background: var(--azul-bg); color: #1e3a8a; border: 1px solid #c7d6fb; }
.aviso.vermelho { background: var(--err-bg); color: #7f1d1d; border: 1px solid #f5c2c2; }

/* Modal */
.fundo { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; }
.modal { background: #fff; border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 50px rgba(15, 23, 42, .3); }
.modal.largo { max-width: 860px; } .modal.estreito { max-width: 420px; }
.modal .mcab { padding: 16px 20px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modal .mcab h2 { margin: 0; }
.modal .mcorpo { padding: 18px 20px; }
.modal .mrod { padding: 14px 20px; border-top: 1px solid var(--bd); display: flex; gap: 8px; justify-content: flex-end; align-items: center; background: #fafbfd; border-radius: 0 0 14px 14px; }
.x { border: 0; background: transparent; font-size: 22px; line-height: 1; color: var(--tx3); cursor: pointer; padding: 2px 6px; }
.form-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s6 { grid-column: span 6; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; } .s9 { grid-column: span 9; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #0f1b2d; color: #fff; padding: 11px 18px; border-radius: 10px; font-weight: 500; z-index: 90; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); max-width: 90vw; }
.toast.erro { background: var(--err); } .toast.aviso { background: #92400e; }

/* PDV */
.pdv { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.pdv-busca { position: relative; }
.pdv-busca input { font-size: 18px; padding: 14px 16px 14px 44px; border-width: 2px; }
.pdv-busca::before { content: "▦"; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--tx3); }
.sugestoes { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--bd); border-radius: 10px; box-shadow: 0 12px 30px rgba(15, 23, 42, .15); z-index: 15; max-height: 360px; overflow-y: auto; }
.sugestoes div.item { padding: 10px 14px; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; border-bottom: 1px solid #f0f2f6; }
.sugestoes div.item.on, .sugestoes div.item:hover { background: var(--pri-bg); }
.pdv-itens { min-height: 340px; max-height: calc(100vh - 290px); overflow-y: auto; }
.pdv-itens td .qtd { display: inline-flex; align-items: center; gap: 4px; }
.pdv-itens td .qtd button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--bd2); background: #fff; cursor: pointer; font-weight: 700; }
.pdv-itens td .qtd input { width: 64px; text-align: center; padding: 4px; }
.total-box { background: #0f1b2d; color: #fff; border-radius: var(--raio); padding: 18px; }
.total-box .rot { color: #9fb0c8; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.total-box .valor { font-size: 40px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.atalhos { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--tx3); }
.pag-formas { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.pag-formas button { border: 2px solid var(--bd); background: #fff; border-radius: 9px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer; }
.pag-formas button.on { border-color: var(--pri); background: var(--pri-bg); color: var(--pri2); }

/* Mesas */
.mesas { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.mesa { border: 2px solid var(--bd); background: #fff; border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer; transition: transform .08s; }
.mesa:hover { transform: translateY(-1px); border-color: var(--bd2); }
.mesa .n { font-size: 22px; font-weight: 800; }
.mesa.ocupada { border-color: #f59e0b; background: #fffbeb; }
.mesa.atual { border-color: var(--pri); box-shadow: 0 0 0 3px rgba(15, 118, 110, .2); }
.comanda { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.cardapio { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.cardapio button { border: 1px solid var(--bd); background: #fff; border-radius: 9px; padding: 10px; text-align: left; cursor: pointer; font: inherit; }
.cardapio button:hover { border-color: var(--pri); background: var(--pri-bg); }

/* Gráfico de barras simples */
.barras { display: flex; align-items: flex-end; gap: 4px; height: 160px; padding-top: 10px; }
.barras .bar { flex: 1; background: linear-gradient(180deg, #14b8a6, #0f766e); border-radius: 4px 4px 0 0; min-width: 6px; position: relative; }
.barras .bar:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #0f1b2d; color: #fff; font-size: 11px; padding: 3px 6px; border-radius: 5px; white-space: nowrap; margin-bottom: 4px; }

/* Boas-vindas */
.boas { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #ccfbf1, transparent 40%), radial-gradient(circle at 90% 90%, #dbeafe, transparent 40%), var(--bg); }
.boas .card { max-width: 640px; width: 100%; padding: 28px; }
.ramos { display: grid; gap: 8px; }
.ramos button { display: flex; gap: 12px; align-items: center; text-align: left; border: 2px solid var(--bd); background: #fff; padding: 12px 14px; border-radius: 10px; cursor: pointer; font: inherit; }
.ramos button.on { border-color: var(--pri); background: var(--pri-bg); }
.ramos .ic { font-size: 24px; }

@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pdv, .comanda { grid-template-columns: 1fr; }
  .pdv-itens { max-height: none; }
}
@media (max-width: 820px) {
  .side { transform: translateX(-100%); transition: transform .2s; }
  .side.aberto { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .3); }
  .main { margin-left: 0; }
  .topo { padding: 10px 16px; }
  .topo .burger { display: inline-flex; }
  .conteudo { padding: 16px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .form-grid > * { grid-column: span 12 !important; }
  .total-box .valor { font-size: 32px; }
  .esconde-mob { display: none !important; }
}
@media (max-width: 520px) { .g4 { grid-template-columns: 1fr 1fr; } .kpi .val { font-size: 19px; } }

/* Ajustes de celular (11/10/2026): itens de grid não podem forçar largura (a tabela do PDV
   empurrava a página para os lados) e o aviso não pode cobrir o botão de pagar. */
.pdv > *, .comanda > *, .grid > * { min-width: 0; }
.pdv-itens { overflow: auto; }
.toast { pointer-events: none; }
@media (max-width: 820px) {
  .toast { bottom: auto; top: 64px; }
  .pdv-itens { min-height: 160px; }
  .pdv-itens table.tab th, .pdv-itens table.tab td { padding: 8px 6px; }
  .pdv-itens td .qtd input { width: 44px; }
  .pdv-busca input { font-size: 16px; padding: 12px 12px 12px 40px; }
  .pdv .atalhos { display: none; }
  .cab .linha { width: 100%; }
  .busca[style*="width"] { width: 100% !important; }
  table.tab { font-size: 13px; }
  .modal .mrod { flex-wrap: wrap; }
}

/* Agenda: rolagem apenas na grade, mantendo a página dentro da tela. */
.agenda-rolagem{max-width:100%;overflow:auto;max-height:65vh;border:1px solid var(--bd);border-radius:12px;background:white}
.agenda-grade th,.agenda-grade td{min-width:170px;vertical-align:top}.agenda-grade th:first-child{min-width:72px}.agenda-grade thead th{position:sticky;top:0;background:white;z-index:1}
.agenda-item{display:block;text-align:left;width:100%;border:1px solid #a7d8ce;background:#edf8f4;border-radius:8px;padding:8px;margin:3px 0;cursor:pointer;white-space:normal}.agenda-item span,.agenda-item small{display:block}

.convite-curso{margin-bottom:14px}.convite-curso h2{font-size:16px;margin-bottom:4px}.convite-curso p{margin:0 0 12px}.convite-curso .linha{flex-wrap:wrap}

/* fotos de cadastro (produto/cliente) */
.mini { width: 32px; height: 32px; object-fit: cover; border-radius: 6px; vertical-align: middle; margin-right: 8px; }
.foto-cad { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--bd); }
.foto-card { width: 100%; height: 64px; object-fit: cover; border-radius: 6px; margin-bottom: 6px; display: block; }

</style>
<script>
/* Balcão Certo — persistência local.
 *
 * Tudo fica no próprio aparelho (IndexedDB). Cada coleção é gravada inteira
 * numa chave: simples, atômico por coleção e rápido o bastante para o volume
 * de um pequeno comércio (milhares de registros). Se o IndexedDB não estiver
 * disponível (navegador antigo, modo privado do Safari), cai para localStorage.
 */
(function () {
  const NOME = 'balcao-certo';
  const STORE = 'kv';
  let idb = null;
  let usarLocal = false;

  function abrir() {
    return new Promise((ok) => {
      if (!('indexedDB' in window)) { usarLocal = true; return ok(); }
      let req;
      try { req = indexedDB.open(NOME, 1); } catch (e) { usarLocal = true; return ok(); }
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => { idb = req.result; ok(); };
      req.onerror = () => { usarLocal = true; ok(); };
    });
  }

  function ler(chave) {
    if (usarLocal) {
      try { const v = localStorage.getItem(NOME + ':' + chave); return Promise.resolve(v ? JSON.parse(v) : undefined); }
      catch (e) { return Promise.resolve(undefined); }
    }
    return new Promise((ok) => {
      const tx = idb.transaction(STORE, 'readonly');
      const r = tx.objectStore(STORE).get(chave);
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ok(undefined);
    });
  }

  function gravar(chave, valor) {
    const copia = JSON.parse(JSON.stringify(valor));   // tira os proxies do Alpine
    if (usarLocal) {
      try { localStorage.setItem(NOME + ':' + chave, JSON.stringify(copia)); return Promise.resolve(true); }
      catch (e) { return Promise.resolve(false); }
    }
    return new Promise((ok) => {
      const tx = idb.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(copia, chave);
      tx.oncomplete = () => ok(true);
      tx.onerror = () => ok(false);
    });
  }

  // Valor "bruto" (sem passar por JSON): usado para o handle da pasta de backup automático, que o
  // navegador só aceita guardar por structured clone no IndexedDB. Sem IndexedDB, não há como guardar.
  function gravarBruto(chave, valor) {
    if (usarLocal) return Promise.resolve(false);
    return new Promise((ok) => {
      const tx = idb.transaction(STORE, 'readwrite');
      if (valor == null) tx.objectStore(STORE).delete(chave); else tx.objectStore(STORE).put(valor, chave);
      tx.oncomplete = () => ok(true); tx.onerror = () => ok(false);
    });
  }
  function lerBruto(chave) { return usarLocal ? Promise.resolve(undefined) : ler(chave); }

  // Pede ao navegador para não apagar os dados quando faltar espaço.
  async function persistir() {
    try { if (navigator.storage && navigator.storage.persist) return await navigator.storage.persist(); }
    catch (e) { /* sem suporte */ }
    return false;
  }

  window.BCDB = { abrir, ler, gravar, gravarBruto, lerBruto, persistir, get modo() { return usarLocal ? 'localStorage' : 'IndexedDB'; } };
})();

</script>
<script>
/* Balcão Certo — verificação do código de ativação.
 * O código é "carga.assinatura" (base64url). A carga é "BC1|pedido|nome|aaaammdd[|ramo]"
 * (o ramo, quando vem, é a edição comprada e decide os módulos),
 * assinada com ECDSA P-256 pela chave privada que só o vendedor tem. Aqui só
 * existe a chave PÚBLICA: dá para conferir, não para gerar.
 */
(function () {
  const CHAVE_PUBLICA = { kty: 'EC', crv: 'P-256', x: 'ZRg8BkhRnXj6kNjHzlRf3jwlC8xosSX--n6-iJqhszU', y: 'IzRCYAroZGjzd4BlQkLtfzdA_jrohK2w38SDW_UFZVw' };

  function deB64u(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function verificar(codigo) {
    try {
      // Aceita o código colado junto com o resto da mensagem (o chat do Mercado Livre
      // vem com link e instruções antes dele). Candidatos: o texto inteiro sem espaços (código
      // puro, mesmo quebrado em linhas) e cada trecho "carga.assinatura" encontrado; vale o
      // primeiro cuja assinatura confere.
      const bruto = String(codigo || '');
      const candidatos = [bruto.replace(/\s+/g, '')].concat(bruto.match(/[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{60,}/g) || []);
      for (let i = 0; i < candidatos.length; i++) {
        const r = await verificarUm(candidatos[i]);
        if (r) return r;
      }
      return null;
    } catch (e) {
      return null;
    }
  }

  async function verificarUm(limpo) {
    try {
      const [c, s] = limpo.split('.');
      if (!c || !s) return null;
      const carga = deB64u(c);
      const texto = new TextDecoder().decode(carga);
      const partes = texto.split('|');
      if (partes[0] !== 'BC1' || partes.length < 4) return null;
      if (!(window.crypto && crypto.subtle)) {
        // Sem WebCrypto (contexto inseguro muito antigo): aceita pelo formato.
        return { pedido: partes[1], nome: partes[2], data: partes[3], ramo: partes[4] || '', conferido: false };
      }
      const chave = await crypto.subtle.importKey('jwk', CHAVE_PUBLICA, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, chave, deB64u(s), carga);
      return ok ? { pedido: partes[1], nome: partes[2], data: partes[3], ramo: partes[4] || '', conferido: true } : null;
    } catch (e) {
      return null;
    }
  }

  window.BCLicenca = { verificar };
})();

<script>
/* Balcão Certo: Code 128 B/C e EAN-13, sem dependências em execução.
 * altura/largura de svgCodigo: pixels. Retorna SVG com área livre lateral.
 * paginaEtiquetas: fragmento HTML para app.imprimir(fragmento, 'A4').
 * O CSS do fragmento substitui o papel do invólucro. Pimaco 6180/6187: Carta.
 * Validar alinhamento em folha comum e leitura na impressora antes de usar adesivos.
 */
(function () {
  'use strict';
  const PADROES = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
  const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  const G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  const PARIDADE = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function codificar(texto) {
    const s = String(texto == null ? '' : texto);
    if (!s || s.length > 80 || !/^[\x20-\x7e]+$/.test(s)) throw new Error('Use de 1 a 80 caracteres, sem acentos ou quebras de linha, no código.');

    let bits = '';

      bits = '101';
      for (let i=1; i<=6; i++) bits += (PARIDADE[Number(s[0])][i-1] === 'L' ? L : G)[Number(s[i])];
      bits += '01010';
      for (let i=7; i<13; i++) bits += L[Number(s[i])].replace(/[01]/g, b => b === '0' ? '1' : '0');
      bits += '101';
      return {bits, s, tipo:'EAN-13', esquerda:11, direita:7};
    }
    const numerico = /^\d+$/.test(s) && s.length % 2 === 0;
    const codigos = [numerico ? 105 : 104];
    if (numerico) for (let i=0; i<s.length; i+=2) codigos.push(Number(s.slice(i,i+2)));
    else for (const c of s) codigos.push(c.charCodeAt(0)-32);
    codigos.push(codigos.reduce((n,c,i) => n + c * (i || 1), 0) % 103, 106);
    for (const c of codigos) for (let i=0; i<PADROES[c].length; i++) bits += (i%2 ? '0' : '1').repeat(Number(PADROES[c][i]));
    return {bits, s, tipo:'Code 128', esquerda:10, direita:10};
  }
  function svgCodigo(texto, opcoes = {}) {
    const c = codificar(texto), n = c.esquerda + c.bits.length + c.direita;
    const altura = opcoes.altura == null ? 64 : Number(opcoes.altura);
    const largura = opcoes.largura == null ? n*2 : Number(opcoes.largura);
    if (!Number.isFinite(altura) || altura < 12 || altura > 2000 || !Number.isFinite(largura) || largura < n || largura > 10000) throw new Error('Dimensões insuficientes ou inválidas para o código.');
    let barras = '';
    for (let i=0; i<c.bits.length; i++) if (c.bits[i] === '1') barras += '<rect x="'+(i+c.esquerda)+'" y="0" width="1" height="'+altura+'"/>';
    return '<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+esc(c.tipo+' '+c.s)+'" data-tipo="'+c.tipo+'" width="'+largura+'" height="'+altura+'" viewBox="0 0 '+n+' '+altura+'" preserveAspectRatio="none"><title>'+esc(c.s)+'</title><rect width="'+n+'" height="'+altura+'" fill="white"/><g fill="black">'+barras+'</g></svg>';
  }
  function paginaEtiquetas(itens, modelo) {
    const modelos = {
      'pimaco-6180': {w:66.7,h:25.4,col:3,lin:10,papel:'215.9mm 279.4mm',margem:'12.7mm 7.9mm',gap:0},
      'pimaco-6187': {w:44.45,h:12.7,col:4,lin:20,papel:'215.9mm 279.4mm',margem:'12.7mm 14.2875mm',gap:3.175},
      'termica-40x25': {w:40,h:25,col:1,lin:1,papel:'40mm 25mm',margem:'0',gap:0}
    };
    const m = modelos[modelo];
    if (!m || !Array.isArray(itens)) throw new Error('Modelo ou lista de etiquetas inválidos.');
    const etiquetas = [];
    for (const item of itens) {
      if (!item || typeof item !== 'object') throw new Error('Item inválido.');
      const q = item.qtd == null ? 1 : Number(item.qtd);

      if (typeof preco === 'string') preco = preco.trim().replace(/R\$|\s/g,'').replace(/\.(?=\d{3}(?:\D|$))/g,'').replace(',','.');
      if (preco == null || preco === '' || !Number.isFinite(Number(preco)) || Number(preco) < 0) throw new Error('Informe um preço válido.');
      const moeda = Number(preco).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
      const h = '<article class="bc-etiqueta"><div class="bc-nome">'+esc(item.nome)+'</div><strong>'+esc(moeda)+'</strong>'+svgCodigo(cod.s,{altura:40})+'<div class="bc-numero">'+esc(cod.s)+'</div></article>';
      for (let i=0; i<q; i++) etiquetas.push(h);
    }
    const capacidade = m.col*m.lin;
    let paginas = '';
    for (let i=0; i<etiquetas.length; i+=capacidade) paginas += '<section class="bc-folha">'+etiquetas.slice(i,i+capacidade).join('')+'</section>';
    return '<style>@page{size:'+m.papel+';margin:'+m.margem+'}html,body{width:auto!important;margin:0!important;padding:0!important;background:white!important}.bc-folha{display:grid;grid-template-columns:repeat('+m.col+','+m.w+'mm);grid-auto-rows:'+m.h+'mm;column-gap:'+m.gap+'mm;row-gap:0;break-after:page}.bc-folha:last-child{break-after:auto}.bc-etiqueta{box-sizing:border-box;width:'+m.w+'mm;height:'+m.h+'mm;padding:'+(m.h<15?'0.3':'0.7')+'mm 2mm;overflow:hidden;break-inside:avoid;text-align:center;font:8pt Arial;color:black}.bc-nome{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:'+(m.h<15?'6':'8')+'pt;line-height:1.1}.bc-etiqueta strong{display:block;font-size:'+(m.h<15?'7':'11')+'pt;line-height:1.1}.bc-etiqueta svg{display:block;width:100%;height:'+(m.h<15?'3.5':'11')+'mm;margin:0.2mm 0}.bc-numero{font:'+(m.h<15?'5':'6')+'pt monospace;line-height:1.1;white-space:nowrap}</style>'+paginas;
  }
  window.BCEtiquetas = Object.freeze({svgCodigo, paginaEtiquetas});
})();

</script>

      if (f.id) { Object.assign(this.produtos.find(p => p.id === f.id), dados); }

    },
    excluirProduto(p) {
      this.pedirConfirmacao('Excluir "' + p.nome + '"? As vendas antigas continuam no histórico.', async () => { p.ativo = false; await this.salvar('produtos'); this.fecharModal(); this.toast('Produto excluído.'); }, true);
    },
    ajustarEstoque(p) { this.form = { produto: p, variacaoId: p.variacoes && p.variacoes.length ? p.variacoes[0].id : null, tipo: 'entrada', qtd: '', custo: p.custo ? this.n2s(p.custo) : '', motivo: '' }; this.modal = 'estoque'; },
    async salvarAjuste() {
      const f = this.form, p = f.produto, q = num(f.qtd);
      if (!q) { this.toast('Informe a quantidade.', 'erro'); return; }

      if (f.tipo === 'entrada') {
        if (num(f.custo) > 0 && !f.variacaoId) {           // custo médio

          p.custo = atual > 0 ? r2((atual * c0 + q * c1) / (atual + q)) : c1;
        } else if (num(f.custo) > 0) p.custo = num(f.custo);

      } else if (f.tipo === 'saida') alvo.estoque = r2((Number(alvo.estoque) || 0) - q);

      (p.movEstoque = p.movEstoque || []).push({ data: agoraISO(), tipo: f.tipo, qtd: q, variacao: f.variacaoId ? alvo.nome : '', motivo: f.motivo });

    baixarEstoque(item, sinal) {

      const alvo = item.variacaoId ? (p.variacoes || []).find(v => v.id === item.variacaoId) : p;

    },

    /* ─────────── etiquetas (módulo do Codex: js/etiquetas.js) ─────────── */

    abrirCliente(c) { this.form = c ? Object.assign({}, c, { limite: c.limite ? this.n2s(c.limite) : '' }) : { id: null, nome: '', telefone: '', doc: '', email: '', endereco: '', nascimento: '', limite: '', obs: '' }; this.modal = 'cliente'; },

    nomeCliente(id) { const c = this.cliente(id); return c ? c.nome : ''; },
    saldoDevedor(id) { return r2(this.contas.filter(c => c.tipo === 'receber' && c.clienteId === id && !c.pagoEm).reduce((s, c) => s + c.valor, 0)); },
    aniversariantes() { const md = hojeISO().slice(5); return this.clientes.filter(c => c.ativo !== false && c.nascimento && c.nascimento.slice(5) === md); },
    whats(tel, msg) { let d = soDigitos(tel); if (!d) return '#'; if (d.length <= 11) d = '55' + d; return 'https://wa.me/' + d + '?text=' + encodeURIComponent(msg || ''); },
    fornecedoresFiltrados() {

    },
    abrirFornecedor(c) { this.form = c ? Object.assign({}, c) : { id: null, nome: '', telefone: '', doc: '', contato: '', email: '', obs: '' }; this.modal = 'fornecedor'; },

    /* ─────────── caixa ─────────── */
    caixaAberto() { return this.caixas.find(c => !c.fechamento) || null; },
    abrirCaixaModal() { this.form = { valorInicial: '', operador: this.cfg.vendedores[0] || '' }; this.modal = 'abrirCaixa'; },
    async abrirCaixa() {
      if (this.caixaAberto()) return;
      this.caixas.push({ id: this.proximo('caixa'), abertura: agoraISO(), valorInicial: num(this.form.valorInicial), operador: this.form.operador || '', movs: [] });

    },
    movCaixaModal(tipo) { this.form = { tipo, valor: '', motivo: '' }; this.modal = 'movCaixa'; },
    async salvarMovCaixa() {
      const cx = this.caixaAberto(); const v = num(this.form.valor);
      if (!cx || !v) { this.toast('Informe o valor.', 'erro'); return; }
      cx.movs.push({ tipo: this.form.tipo, valor: v, motivo: this.form.motivo || '', data: agoraISO() });
      await this.salvar('caixas'); this.fecharModal(); this.toast(this.form.tipo === 'sangria' ? 'Sangria registrada.' : 'Reforço registrado.');
    },
    resumoCaixa(cx) {
      if (!cx) return null;
      const vendas = this.vendas.filter(v => v.caixaId === cx.id && !v.cancelada);
      const porForma = {};
      for (const v of vendas) for (const p of v.pagamentos) porForma[p.forma] = r2((porForma[p.forma] || 0) + p.valor - (p.forma === 'dinheiro' ? (v.troco || 0) : 0));
      const receb = this.contas.filter(c => c.tipo === 'receber' && c.recebidoCaixaId === cx.id);
      const recebDinheiro = r2(receb.filter(c => c.forma === 'dinheiro').reduce((s, c) => s + (c.valorPago || 0), 0));
      const pagasDinheiro = r2(this.contas.filter(c => c.tipo === 'pagar' && c.pagoCaixaId === cx.id && c.forma === 'dinheiro').reduce((s, c) => s + (c.valorPago || 0), 0));
      const sangrias = r2(cx.movs.filter(m => m.tipo === 'sangria').reduce((s, m) => s + m.valor, 0));
      const reforcos = r2(cx.movs.filter(m => m.tipo === 'suprimento').reduce((s, m) => s + m.valor, 0));
      const devolucoes = r2(cx.movs.filter(m => m.tipo === 'devolucao').reduce((s, m) => s + m.valor, 0));
      const esperadoDinheiro = r2(cx.valorInicial + (porForma.dinheiro || 0) + recebDinheiro + reforcos - sangrias - pagasDinheiro - devolucoes);
      return { vendas: vendas.length, total: r2(vendas.reduce((s, v) => s + v.total, 0)), porForma, recebDinheiro, pagasDinheiro, sangrias, reforcos, devolucoes, esperadoDinheiro };
    },
    fecharCaixaModal() { this.form = { contado: '' }; this.modal = 'fecharCaixa'; },
    async fecharCaixa() {
      const cx = this.caixaAberto(); if (!cx) return;
      const res = this.resumoCaixa(cx);
      cx.fechamento = agoraISO(); cx.valorContado = num(this.form.contado); cx.esperado = res.esperadoDinheiro; cx.resumo = res;
      await this.salvar('caixas'); this.fecharModal();
      this.imprimirFechamento(cx);
      this.toast('Caixa fechado.');
      if (this.cfg.backupAuto && this.cfg.backupAuto.pasta) { if (await this.backupAutomatico('caixa')) this.toast('Caixa fechado. Backup do dia salvo em "' + this.cfg.backupAuto.pasta + '".'); }
      else if (this.diasSemBackup() >= 1) this.toast('Caixa fechado. Recomendamos salvar um backup agora (Configurações).');
    },
    nomeForma(id) { if (id === 'vale') return 'Vale-compra'; const f = this.cfg.pagamentos.find(p => p.id === id); return f ? f.nome : id; },
    garantirCaixa(depois) {
      if (this.caixaAberto()) return true;
      this._depoisAbrirCaixa = depois; this.abrirCaixaModal(); return false;
    },

    /* ─────────── PDV ─────────── */
    buscarPdv() {
      const q = this.pdv.busca.trim().toLowerCase().replace(/^\d+(,\d+)?\s*\*\s*/, '');
      if (q.length < 1) { this.pdv.sugestoes = []; return; }
      const l = [], termos = semAcento(q).split(/\s+/).filter(Boolean);
      const casa = txt => { const t = semAcento(txt.toLowerCase()); return termos.every(x => t.includes(x)); };
      for (const p of this.produtos) {
        if (p.ativo === false) continue;
        const txt = p.nome + ' ' + p.codigo + ' ' + p.barras + ' ' + p.categoria;
        if (p.variacoes && p.variacoes.length) {
          for (const v of p.variacoes) if (casa(txt + ' ' + v.nome + ' ' + v.barras)) l.push({ p, v });
        } else if (casa(txt)) l.push({ p, v: null });
        if (l.length >= 12) break;
      }
      this.pdv.sugestoes = l; this.pdv.sel = 0;
    },
    enterPdv() {
      const bruto = this.pdv.busca.trim();
      if (!bruto) { if (this.pdv.itens.length) this.abrirPagamento(); return; }
      let mult = 1, termo = bruto;
      const m = bruto.match(/^(\d+(?:,\d+)?)\s*\*\s*(.+)$/);
      if (m) { mult = num(m[1]) || 1; termo = m[2].trim(); }
      // Código de barras de balança (EAN-13 começando com 2): 2 CCCCC VVVVV D → código + preço total
      if (/^2\d{12}$/.test(termo)) {
        const cod = String(parseInt(termo.slice(1, 6), 10)), valor = parseInt(termo.slice(6, 11), 10) / 100;
        const pb = this.produtos.find(p => p.ativo !== false && (p.codigo === cod || p.codigo === termo.slice(1, 6)));
        if (pb && pb.preco) { this.adicionarItem(pb, null, r2(valor / pb.preco)); this.pdv.busca = ''; this.pdv.sugestoes = []; return; }
      }
      const exato = this.acharPorCodigo(termo);
      if (exato) { this.adicionarItem(exato.p, exato.v, mult); this.pdv.busca = ''; this.pdv.sugestoes = []; return; }
      const s = this.pdv.sugestoes[this.pdv.sel];
      if (s) { this.adicionarItem(s.p, s.v, mult); this.pdv.busca = ''; this.pdv.sugestoes = []; return; }
      this.toast('Produto não encontrado: ' + termo, 'erro');
    },
    acharPorCodigo(t) {
      const x = t.toLowerCase();
      for (const p of this.produtos) {
        if (p.ativo === false) continue;
        for (const v of (p.variacoes || [])) if (v.barras && v.barras.toLowerCase() === x) return { p, v };
        if ((p.barras && p.barras.toLowerCase() === x) || (p.codigo && p.codigo.toLowerCase() === x)) {
          if (p.variacoes && p.variacoes.length) return null;   // precisa escolher tamanho/cor
          return { p, v: null };
        }
      }
      return null;
    },
    precoItem(p, q) { return (p.precoAtacado > 0 && p.qtdAtacado > 0 && q >= p.qtdAtacado) ? p.precoAtacado : p.preco; },
    adicionarItem(p, v, q = 1) {
      if (this.estoqueVai(p, v, q) < 0 && p.controlaEstoque !== false && p.tipo !== 'servico') this.toast('Atenção: "' + p.nome + '" vai ficar com estoque negativo.', 'aviso');
      const ex = this.pdv.itens.find(i => i.produtoId === p.id && i.variacaoId === (v ? v.id : null));
      if (ex) { ex.qtd = r2(ex.qtd + q); ex.preco = this.precoItem(p, ex.qtd); }
      else this.pdv.itens.push({ uid: Date.now() + Math.random(), produtoId: p.id, variacaoId: v ? v.id : null, nome: p.nome + (v ? ' (' + v.nome + ')' : ''), qtd: q, preco: this.precoItem(p, q), custo: p.custo || 0, unidade: p.unidade || 'un' });
      this.$nextTick(() => { const el = document.querySelector('.pdv-itens tbody tr:last-child'); el && el.scrollIntoView({ block: 'nearest' }); this.focarPdv(); });
    },
    estoqueVai(p, v, q) { const atual = v ? (Number(v.estoque) || 0) : (Number(p.estoque) || 0); const noCarrinho = this.pdv.itens.filter(i => i.produtoId === p.id && i.variacaoId === (v ? v.id : null)).reduce((s, i) => s + i.qtd, 0); return atual - noCarrinho - q; },
    alterarQtd(i, d) { i.qtd = r2(Math.max(0.001, (Number(i.qtd) || 0) + d)); const p = this.produtos.find(x => x.id === i.produtoId); if (p) i.preco = this.precoItem(p, i.qtd); },
    removerItem(i) { this.pdv.itens = this.pdv.itens.filter(x => x !== i); this.focarPdv(); },
    subtotalPdv() { return r2(this.pdv.itens.reduce((s, i) => s + i.qtd * i.preco, 0)); },
    descontoPdv() {
      const t = String(this.pdv.desconto || '').trim(); const sub = this.subtotalPdv();
      if (!t) return 0;
      if (t.endsWith('%')) return r2(sub * Math.min(100, num(t.slice(0, -1))) / 100);
      return r2(Math.min(sub, num(t)));
    },
    totalPdv() { return r2(this.subtotalPdv() - this.descontoPdv() + (Number(this.pdv.acrescimo) || 0)); },
    limparPdv() { Object.assign(this.pdv, { busca: '', itens: [], clienteId: '', desconto: '', obs: '', sugestoes: [], origem: 'pdv', refId: null, acrescimo: 0, acrescimoRotulo: '' }); },
    cancelarPdv() { if (!this.pdv.itens.length) return; this.pedirConfirmacao('Cancelar esta venda e limpar os itens?', () => { this.limparPdv(); this.focarPdv(); }); },
    abrirPagamento() {
      if (!this.pdv.itens.length) { this.toast('Adicione itens primeiro.', 'erro'); return; }
      if (this.demoEstourou('vendas')) { this.toast('No modo demonstração o limite é ' + LIMITE_DEMO.vendas + ' vendas. Ative o sistema em Configurações.', 'erro'); return; }
      if (!this.garantirCaixa(() => this.abrirPagamento())) return;
      this.pag = { linhas: [], forma: 'dinheiro', valor: this.n2s(this.totalPdv()), parcelas: 1, primeiroVenc: addMeses(hojeISO(), 1) };
      this.modal = 'pagamento';
      this.$nextTick(() => { const el = document.getElementById('pag-valor'); el && (el.focus(), el.select()); });
    },
    pagoPdv() { return r2(this.pag.linhas.reduce((s, l) => s + l.valor, 0)); },
    faltaPdv() { return r2(Math.max(0, this.totalPdv() - this.pagoPdv())); },
    trocoPdv() { const exc = r2(this.pagoPdv() - this.totalPdv()); const din = this.pag.linhas.filter(l => l.forma === 'dinheiro').reduce((s, l) => s + l.valor, 0); return exc > 0 ? Math.min(exc, din) : 0; },
    adicionarPagamento() {
      let v = num(this.pag.valor);
      if (!v) v = this.faltaPdv();
      if (!v) return;
      if (this.pag.forma !== 'dinheiro' && v > this.faltaPdv() + 0.001) { this.toast('Só pagamento em dinheiro pode passar do total (troco).', 'erro'); return; }
      if (this.pag.forma === 'vale') {
        const vale = this.valePorCodigo(this.pag.valeCodigo);
        if (!vale) { this.toast('Vale-compra não encontrado. Confira o código impresso no vale.', 'erro'); return; }
        if (vale.saldo <= 0.001) { this.toast('Esse vale já foi usado por completo.', 'erro'); return; }
        if (this.pag.linhas.some(l => l.valeId === vale.id)) { this.toast('Esse vale já está nesta venda.', 'erro'); return; }
        v = Math.min(v, vale.saldo);
        this.pag.linhas.push({ forma: 'vale', valor: r2(v), parcelas: 1, valeId: vale.id, valeCodigo: vale.codigo });
        this.pag.valor = ''; this.pag.valeCodigo = ''; this.pag.forma = 'dinheiro';
        return;
      }
      if (this.pag.forma === 'crediario') {
        if (!this.pdv.clienteId) { this.toast('Para crediário/fiado escolha o cliente da venda.', 'erro'); return; }
        const c = this.cliente(this.pdv.clienteId);
        if (c && c.limite > 0 && this.saldoDevedor(c.id) + v > c.limite + 0.001) { this.toast('Passa do limite de crédito de ' + c.nome + ' (' + this.brl(c.limite) + ', em aberto ' + this.brl(this.saldoDevedor(c.id)) + ').', 'erro'); return; }
      }
      this.pag.linhas.push({ forma: this.pag.forma, valor: r2(v), parcelas: this.pag.forma === 'crediario' ? Math.max(1, parseInt(this.pag.parcelas) || 1) : 1, primeiroVenc: this.pag.primeiroVenc });
      this.pag.valor = this.faltaPdv() ? this.n2s(this.faltaPdv()) : '';
      if (!this.faltaPdv()) this.$nextTick(() => { const b = document.getElementById('pag-finalizar'); b && b.focus(); });
    },
    async finalizarVenda() {
      let atendimento = null;
      if (this.pdv.origem === 'agenda') {
        atendimento = this.agenda.find(a=>a.id===this.pdv.refId);
        if(!atendimento || atendimento.vendaId || ['cancelado','faltou'].includes(atendimento.status)){this.toast('Atendimento indisponível para cobrança.','erro');return;}
        this.pdv.vendedor=atendimento.profissional;
      }
      if (this.pag.linhas.length === 0 && num(this.pag.valor)) this.adicionarPagamento();
      if (this.faltaPdv() > 0.001) { this.toast('Ainda falta receber ' + this.brl(this.faltaPdv()) + '.', 'erro'); return; }
      const cx = this.caixaAberto();
      const venda = {
        id: this.proximo('venda'), numero: 0, data: agoraISO(), origem: this.pdv.origem, refId: this.pdv.refId,
        itens: this.pdv.itens.map(i => ({ produtoId: i.produtoId, variacaoId: i.variacaoId, nome: i.nome, qtd: i.qtd, preco: i.preco, custo: i.custo, unidade: i.unidade, obs: i.obs || '' })),
        subtotal: this.subtotalPdv(), desconto: this.descontoPdv(), acrescimo: Number(this.pdv.acrescimo) || 0, acrescimoRotulo: this.pdv.acrescimoRotulo || '',
        total: this.totalPdv(), pagamentos: this.pag.linhas.map(l => ({ forma: l.forma, valor: l.valor, parcelas: l.parcelas, valeId: l.valeId })), troco: this.trocoPdv(),
        clienteId: this.pdv.clienteId || null, vendedor: this.pdv.vendedor || '', caixaId: cx ? cx.id : null, obs: this.pdv.obs || '', cancelada: false,
      };
      venda.numero = venda.id;
      for (const i of venda.itens) this.baixarEstoque(i, 1);
      // vale-compra usado como pagamento: abate o saldo e registra o uso
      for (const l of this.pag.linhas.filter(l => l.forma === 'vale')) { const vale = this.vales.find(x => x.id === l.valeId); if (vale) { vale.saldo = r2(vale.saldo - l.valor); vale.usos = vale.usos || []; vale.usos.push({ vendaId: venda.id, valor: l.valor, data: venda.data }); } }
      // crediário vira contas a receber (carnê)
      for (const l of this.pag.linhas.filter(l => l.forma === 'crediario')) {
        const n = l.parcelas, base = Math.floor(l.valor / n * 100) / 100;
        for (let k = 0; k < n; k++) {
          const valor = k === n - 1 ? r2(l.valor - base * (n - 1)) : base;
          this.contas.push({ id: this.proximo('conta'), tipo: 'receber', descricao: 'Venda nº ' + venda.numero + (n > 1 ? ' — parcela ' + (k + 1) + '/' + n : ''), valor, vencimento: addMeses(l.primeiroVenc || addMeses(hojeISO(), 1), k), clienteId: venda.clienteId, vendaId: venda.id, parcela: (k + 1) + '/' + n, categoria: 'Crediário', criadoEm: agoraISO() });
        }
      }
      this.vendas.push(venda);
      if(atendimento){atendimento.status='atendido';atendimento.vendaId=venda.id;venda.comissaoPct=Math.max(0,Math.min(100,num(this.cfg.comissoes[atendimento.profissional])));}
      if (venda.origem === 'os') { const o = this.os.find(x => x.id === venda.refId); if (o) { o.vendaId = venda.id; this.mudarStatusOS(o, 'Entregue', true); } }
      if (venda.origem === 'mesa' || venda.origem === 'delivery') { const c = this.comandas.find(x => x.id === venda.refId); if (c) { c.status = 'fechada'; c.vendaId = venda.id; c.fechadaEm = agoraISO(); this.comandaAtual = null; } }
      await this.salvar('vendas', 'produtos', 'contas', 'os', 'comandas', 'agenda', 'cfg', 'vales');
      this.ultimaVenda = venda;
      this.modal = 'vendaOk';
      const origem = venda.origem;
      this.limparPdv();
      if (origem === 'agenda') this.ir('agenda'); else if (origem === 'os') this.ir('os'); else if (origem === 'mesa' || origem === 'delivery') this.ir('mesas');
    },
    novaVendaDepois() { this.fecharModal(); if (this.rota === 'pdv') this.focarPdv(); },

    /* ─────────── vendas realizadas ─────────── */
    vendasFiltradas() {
      const q = this.busca.vendas.trim().toLowerCase();
      let l = this.vendas.filter(v => { const d = this.diaLocal(v.data); return d >= this.periodo.de && d <= this.periodo.ate; });
      if (q) l = l.filter(v => (String(v.numero) + ' ' + this.nomeCliente(v.clienteId) + ' ' + v.itens.map(i => i.nome).join(' ') + ' ' + v.vendedor).toLowerCase().includes(q));
      return l.slice().reverse();
    },
    cancelarVenda(v) {
      if(v.cancelada)return;
      if ((v.devolucoes || []).length) { this.toast('Esta venda já tem devolução registrada; não dá para cancelar por inteiro.', 'erro'); return; }
      this.pedirConfirmacao('Cancelar a venda nº ' + v.numero + '? O estoque volta e as parcelas em aberto do crediário são apagadas.', async () => {
        v.cancelada = true; v.canceladaEm = agoraISO();
        for (const i of v.itens) this.baixarEstoque(i, -1);
        for (const p of v.pagamentos.filter(p => p.forma === 'vale' && p.valeId)) { const vale = this.vales.find(x => x.id === p.valeId); if (vale) { vale.saldo = r2(vale.saldo + p.valor); vale.usos = (vale.usos || []).filter(u => u.vendaId !== v.id); } }
        this.contas = this.contas.filter(c => !(c.vendaId === v.id && !c.pagoEm));
        if(v.origem==='agenda'){const a=this.agenda.find(a=>a.id===v.refId && a.vendaId===v.id);if(a){a.vendaId=null;a.status='confirmado';}}
        await this.salvar('vendas', 'produtos', 'contas', 'agenda', 'vales'); this.fecharModal(); this.toast('Venda cancelada.');
      }, true);
    },
    verVenda(v) { this.form = { venda: v }; this.modal = 'verVenda'; },

    /* ─────────── devolução parcial e vale-compra ───────────
     * Devolver 1 item de uma venda de 3 não é cancelar a venda: o item volta ao estoque, a venda guarda
     * a devolução (data, itens, valor) e o cliente recebe o valor como VALE-COMPRA (crédito com código,
     * usado como forma de pagamento no PDV) ou em dinheiro (sai do caixa aberto). O valor devolvido
     * respeita o desconto da venda (proporcional ao total pago). */
    devolvidoItem(v, idx) { return (v.devolucoes || []).reduce((s, d) => s + (d.itens.find(i => i.idx === idx) || { qtd: 0 }).qtd, 0); },
    totalDevolvido(v) { return r2((v.devolucoes || []).reduce((s, d) => s + d.total, 0)); },
    /** Custo histórico dos itens já devolvidos (para o lucro/DRE não contar custo de mercadoria que voltou). */
    custoDevolvido(v) { return r2((v.devolucoes || []).reduce((s, d) => s + d.itens.reduce((a, i) => a + i.qtd * ((v.itens[i.idx] || {}).custo || 0), 0), 0)); },
    /** Quanto ainda pode ser restituído desta venda: o que foi pago pelos itens, menos o já devolvido. */
    restituivel(v) { return r2(Math.max(0, (v.total - (v.acrescimo || 0)) - this.totalDevolvido(v))); },
    fatorDevolucao(v) { return v.subtotal ? Math.max(0, Math.min(1, (v.total - (v.acrescimo || 0)) / v.subtotal)) : 1; },
    /** Valor de uma devolução em centavos: cada item proporcional ao desconto, com teto no restituível; se
     *  esta devolução completa a venda, leva exatamente o resíduo (R$ 2,00 pagos por 3 itens nunca viram R$ 2,01). */
    valorDevolucao(v, itens) {
      const fator = this.fatorDevolucao(v);
      let cent = itens.reduce((s, i) => s + Math.round(i.qtd * i.preco * fator * 100), 0);
      const teto = Math.round(this.restituivel(v) * 100);
      const completa = v.itens.every((it, idx) => this.devolvidoItem(v, idx) + ((itens.find(i => i.idx === idx) || {}).qtd || 0) >= it.qtd - 1e-9);
      if (completa) cent = teto;
      return Math.min(cent, teto) / 100;
    },
    abrirDevolucao(v) {
      if (v.cancelada) return;
      const itens = v.itens.map((i, idx) => ({ idx, nome: i.nome, preco: i.preco, unidade: i.unidade || 'un', maximo: r2(i.qtd - this.devolvidoItem(v, idx)), qtd: '' })).filter(i => i.maximo > 0);
      if (!itens.length) { this.toast('Todos os itens desta venda já foram devolvidos.', 'erro'); return; }
      this.form = { venda: v, itens, forma: 'vale', motivo: '', fator: this.fatorDevolucao(v) };
      this.modal = 'devolucao';
    },
    totalDevolucaoForm() { const f = this.form; if (!f || !f.itens || !f.venda) return 0; return this.valorDevolucao(f.venda, f.itens.map(i => ({ idx: i.idx, preco: i.preco, qtd: Math.min(num(i.qtd), i.maximo) }))); },
    novoCodigoVale() { return 'VALE-' + String(this.proximo('vale')).padStart(4, '0'); },
    valePorCodigo(codigo) { const c = String(codigo || '').trim().toUpperCase().replace(/\s+/g, ''); if (!c) return null; return this.vales.find(v => v.codigo.replace(/\s+/g, '') === c && !v.cancelado) || null; },
    valesAbertos() { return this.vales.filter(v => !v.cancelado && v.saldo > 0.001); },
    async registrarDevolucao() {
      // Trava (Codex r10, P1): duas confirmações em sequência gravavam duas devoluções do mesmo item.
      if (this.devolvendo) return;
      this.devolvendo = true;
      try { await this._registrarDevolucao(); } finally { this.devolvendo = false; }
    },
    async _registrarDevolucao() {
      const f = this.form, v = f.venda;
      if (v.cancelada) { this.toast('Esta venda está cancelada.', 'erro'); return; }
      const itens = f.itens.map(i => ({ idx: i.idx, nome: i.nome, preco: i.preco, qtd: num(i.qtd) })).filter(i => i.qtd > 0);
      if (!itens.length) { this.toast('Informe a quantidade devolvida de pelo menos um item.', 'erro'); return; }
      // O limite é recalculado AGORA, a partir das devoluções já gravadas — não do que o formulário viu ao abrir.
      const estourado = itens.find(i => i.qtd > r2(v.itens[i.idx].qtd - this.devolvidoItem(v, i.idx)) + 0.001);
      if (estourado) { this.toast('"' + estourado.nome + '": a quantidade passa do que ainda pode ser devolvido.', 'erro'); return; }
      const total = this.valorDevolucao(v, itens);
      if (total <= 0) { this.toast('O valor da devolução ficou zero.', 'erro'); return; }
      const cx = this.caixaAberto();
      if (f.forma === 'dinheiro' && !cx) { this.toast('Para devolver em dinheiro, abra o caixa primeiro.', 'erro'); return; }
      const dev = { id: Date.now(), data: agoraISO(), itens, total, forma: f.forma, motivo: (f.motivo || '').trim(), valeId: null, caixaId: cx ? cx.id : null };
      for (const i of itens) { const orig = v.itens[i.idx]; this.baixarEstoque({ produtoId: orig.produtoId, variacaoId: orig.variacaoId, qtd: i.qtd }, -1); }
      let vale = null;
      if (f.forma === 'vale') {
        vale = { id: Date.now() + 1, codigo: this.novoCodigoVale(), valor: total, saldo: total, clienteId: v.clienteId || null, vendaId: v.id, criadoEm: dev.data, usos: [], cancelado: false };
        this.vales.push(vale); dev.valeId = vale.id;
      } else {
        cx.movs.push({ tipo: 'devolucao', valor: total, motivo: 'Devolução da venda nº ' + v.numero + (dev.motivo ? ' — ' + dev.motivo : ''), data: dev.data });
      }
      v.devolucoes = v.devolucoes || []; v.devolucoes.push(dev);
      await this.salvar('vendas', 'produtos', 'vales', 'caixas', 'cfg');
      this.form = { venda: v, vale };
      this.modal = vale ? 'valeOk' : 'verVenda';
      this.toast(vale ? 'Devolução registrada. Vale ' + vale.codigo + ' de ' + this.brl(total) + ' gerado.' : 'Devolução registrada: ' + this.brl(total) + ' saíram do caixa.');
    },
    async cancelarVale(vale) {
      this.pedirConfirmacao('Cancelar o vale ' + vale.codigo + ' (saldo ' + this.brl(vale.saldo) + ')? O cliente não poderá mais usá-lo.', async () => { vale.cancelado = true; vale.canceladoEm = agoraISO(); await this.salvar('vales'); this.toast('Vale cancelado.'); }, true);
    },
    imprimirVale(vale) {
      const c = this.cliente(vale.clienteId);
      const h = this.cabecalhoCupom() + '<div class="c b g">VALE-COMPRA</div><div class="c g b" style="font-size:1.6em;letter-spacing:1px;margin:6px 0">' + esc(vale.codigo) + '</div>'
        + '<table><tr><td>Valor</td><td class="r">' + this.n2(vale.valor) + '</td></tr><tr><td>Saldo disponível</td><td class="r b">' + this.n2(vale.saldo) + '</td></tr></table><hr>'
        + (c ? '<div>Cliente: ' + esc(c.nome) + '</div>' : '') + '<div>Emitido em ' + this.dataHora(vale.criadoEm) + ' — ref. venda nº ' + esc(vale.vendaId) + '</div>'
        + '<div class="c" style="margin-top:8px">Apresente este código no caixa para usar o crédito em novas compras. Não é trocado por dinheiro.</div>';
      this.imprimir(h);
    },
    devolucoesPeriodo() { const out = []; for (const v of this.vendas) for (const d of (v.devolucoes || [])) if (this.diaLocal(d.data) >= this.periodo.de && this.diaLocal(d.data) <= this.periodo.ate) out.push(Object.assign(Object.create({ _venda: v }), d)); return out; },
    lucroVenda(v) { return r2(v.total - (v.acrescimo || 0) - v.itens.reduce((s, i) => s + i.qtd * (i.custo || 0), 0) - this.taxasVenda(v) - this.totalDevolvido(v) + this.custoDevolvido(v)); },
    taxasVenda(v) { return r2(v.pagamentos.reduce((s, p) => { const f = this.cfg.pagamentos.find(x => x.id === p.forma); return s + (f ? p.valor * (f.taxa || 0) / 100 : 0); }, 0)); },

    /* ─────────── financeiro ─────────── */
    contasFiltradas() {
      const hoje = hojeISO();
      let l = this.contas.filter(c => c.tipo === this.filtro.contasTipo);
      if (this.filtro.contas === 'abertas') l = l.filter(c => !c.pagoEm);
      if (this.filtro.contas === 'vencidas') l = l.filter(c => !c.pagoEm && c.vencimento < hoje);
      if (this.filtro.contas === 'pagas') l = l.filter(c => c.pagoEm);
      return l.sort((a, b) => (a.vencimento || '').localeCompare(b.vencimento || ''));
    },
    totalContas(tipo, sit) { const hoje = hojeISO(); return r2(this.contas.filter(c => c.tipo === tipo && !c.pagoEm && (sit !== 'vencidas' || c.vencimento < hoje) && (sit !== 'semana' || c.vencimento <= addDias(hoje, 7))).reduce((s, c) => s + c.valor, 0)); },
    abrirConta(tipo, c) {
      this.form = c ? Object.assign({}, c, { valor: this.n2s(c.valor) }) : { id: null, tipo, descricao: '', valor: '', vencimento: hojeISO(), categoria: tipo === 'pagar' ? 'Despesas gerais' : 'Outros', clienteId: '', fornecedorId: '', repetir: 1, pagarAgora: false, forma: 'dinheiro' };
      this.modal = 'conta';
    },
    categoriasDespesa() { return ['Aluguel', 'Água / luz / internet', 'Salários', 'Fornecedores / mercadoria', 'Impostos', 'Manutenção', 'Marketing', 'Despesas gerais']; },
    async salvarConta() {
      const f = this.form, v = num(f.valor);
      if (!f.descricao.trim() || !v) { this.toast('Informe descrição e valor.', 'erro'); return; }
      if (f.id) { Object.assign(this.contas.find(c => c.id === f.id), { descricao: f.descricao.trim(), valor: v, vencimento: f.vencimento, categoria: f.categoria, clienteId: f.clienteId || null, fornecedorId: f.fornecedorId || null }); }
      else {
        const n = Math.max(1, parseInt(f.repetir) || 1);
        for (let k = 0; k < n; k++) {
          const c = { id: this.proximo('conta'), tipo: f.tipo, descricao: f.descricao.trim() + (n > 1 ? ' (' + (k + 1) + '/' + n + ')' : ''), valor: v, vencimento: addMeses(f.vencimento, k), categoria: f.categoria, clienteId: f.clienteId || null, fornecedorId: f.fornecedorId || null, criadoEm: agoraISO() };
          if (k === 0 && f.pagarAgora) this.baixarConta(c, f.forma, v);
          this.contas.push(c);
        }
      }
      await this.salvar('contas', 'cfg', 'caixas'); this.fecharModal(); this.toast('Lançamento salvo.');
    },
    baixarConta(c, forma, valor) {
      c.pagoEm = agoraISO(); c.forma = forma; c.valorPago = r2(valor == null ? c.valor : valor);
      const cx = this.caixaAberto();
      if (cx) { if (c.tipo === 'receber') c.recebidoCaixaId = cx.id; else c.pagoCaixaId = cx.id; }
    },
    abrirBaixa(c) { this.form = { conta: c, forma: 'dinheiro', valor: this.n2s(c.valor) }; this.modal = 'baixa'; },
    async confirmarBaixa() {
      const c = this.form.conta, v = num(this.form.valor);
      if (!v) return;
      if (v < c.valor - 0.009) {   // pagamento parcial: o resto vira uma nova conta
        this.contas.push(Object.assign({}, c, { id: this.proximo('conta'), valor: r2(c.valor - v), descricao: c.descricao + ' (restante)', pagoEm: null, valorPago: null, criadoEm: agoraISO() }));
        c.valor = v;
      }
      this.baixarConta(c, this.form.forma, v);
      await this.salvar('contas', 'cfg'); this.fecharModal(); this.toast(c.tipo === 'receber' ? 'Recebimento registrado.' : 'Pagamento registrado.');
      if (c.tipo === 'receber') this.imprimirRecibo(c);
    },
    estornarConta(c) { this.pedirConfirmacao('Desfazer a baixa de "' + c.descricao + '"?', async () => { c.pagoEm = null; c.valorPago = null; c.recebidoCaixaId = null; c.pagoCaixaId = null; await this.salvar('contas'); this.toast('Baixa desfeita.'); }, true); },
    excluirConta(c) { this.pedirConfirmacao('Excluir o lançamento "' + c.descricao + '"?', async () => { this.contas = this.contas.filter(x => x !== c); await this.salvar('contas'); this.fecharModal(); this.toast('Lançamento excluído.'); }, true); },
    nomeFornecedor(id) { const f = this.fornecedores.find(x => x.id === id); return f ? f.nome : ''; },

    /* DRE do período: competência = data da venda e vencimento da despesa. */
    dre() {
      const de = this.periodo.de, ate = this.periodo.ate;
      const vs = this.vendas.filter(v => !v.cancelada && this.diaLocal(v.data) >= de && this.diaLocal(v.data) <= ate);
      const bruta = r2(vs.reduce((s, v) => s + v.subtotal + (v.acrescimo || 0), 0));
      const descontos = r2(vs.reduce((s, v) => s + (v.desconto || 0), 0));
      const cmv = r2(vs.reduce((s, v) => s + v.itens.reduce((a, i) => a + i.qtd * (i.custo || 0), 0), 0));
      const taxas = r2(vs.reduce((s, v) => s + this.taxasVenda(v), 0));
      const desp = this.contas.filter(c => c.tipo === 'pagar' && c.vencimento >= de && c.vencimento <= ate && c.categoria !== 'Fornecedores / mercadoria');
      const porCat = {};
      for (const c of desp) porCat[c.categoria || 'Outras'] = r2((porCat[c.categoria || 'Outras'] || 0) + c.valor);
      const despesas = r2(desp.reduce((s, c) => s + c.valor, 0));
      // Devoluções entram na DATA DA DEVOLUÇÃO: reduzem a receita e devolvem o custo histórico dos itens
      const devs = this.devolucoesPeriodo();
      const devolucoes = r2(devs.reduce((s, d) => s + d.total, 0));
      const cmvDevolvido = r2(devs.reduce((s, d) => s + d.itens.reduce((a, i) => a + i.qtd * ((d._venda.itens[i.idx] || {}).custo || 0), 0), 0));
      const liquida = r2(bruta - descontos - devolucoes);
      const cmvLiquido = r2(cmv - cmvDevolvido);
      const bruto = r2(liquida - cmvLiquido - taxas);
      return { vendas: vs.length, bruta, descontos, devolucoes, liquida, cmv: cmvLiquido, taxas, bruto, porCat, despesas, lucro: r2(bruto - despesas), margem: liquida ? r2((bruto - despesas) / liquida * 100) : 0 };
    },
    /* Fluxo de caixa realizado: dinheiro que entrou e saiu de fato, por dia. */
    fluxo() {
      const de = this.periodo.de, ate = this.periodo.ate, dias = {};
      const add = (d, campo, v) => { if (d < de || d > ate) return; dias[d] = dias[d] || { dia: d, entradas: 0, saidas: 0 }; dias[d][campo] = r2(dias[d][campo] + v); };
      for (const v of this.vendas) if (!v.cancelada) {
        for (const p of v.pagamentos) if (p.forma !== 'crediario' && p.forma !== 'vale') add(this.diaLocal(v.data), 'entradas', p.valor - (p.forma === 'dinheiro' ? (v.troco || 0) : 0)); // vale é crédito, não dinheiro
        for (const d of (v.devolucoes || [])) if (d.forma === 'dinheiro') add(this.diaLocal(d.data), 'saidas', d.total);
      }
      for (const c of this.contas) if (c.pagoEm) add(this.diaLocal(c.pagoEm), c.tipo === 'receber' ? 'entradas' : 'saidas', c.valorPago || c.valor);
      let saldo = 0;
      return Object.values(dias).sort((a, b) => a.dia.localeCompare(b.dia)).map(d => { saldo = r2(saldo + d.entradas - d.saidas); return Object.assign(d, { saldo }); });
    },
    periodoRapido(tipo) {
      const h = hojeISO();
      if (tipo === 'hoje') this.periodo = { de: h, ate: h };
      if (tipo === 'mes') this.periodo = { de: h.slice(0, 8) + '01', ate: h };
      if (tipo === 'mesPassado') { const ini = addMeses(h.slice(0, 8) + '01', -1); this.periodo = { de: ini, ate: addDias(h.slice(0, 8) + '01', -1) }; }
      if (tipo === '30') this.periodo = { de: addDias(h, -29), ate: h };
      if (tipo === 'ano') this.periodo = { de: h.slice(0, 4) + '-01-01', ate: h };
    },

    /* ─────────── relatórios ─────────── */
    vendasPeriodo() { return this.vendas.filter(v => !v.cancelada && this.diaLocal(v.data) >= this.periodo.de && this.diaLocal(v.data) <= this.periodo.ate); },
    resumoPeriodo() {
      const vs = this.vendasPeriodo(); const total = r2(vs.reduce((s, v) => s + v.total, 0));
      const lucro = r2(vs.reduce((s, v) => s + this.lucroVenda(v), 0));
      const devs = this.devolucoesPeriodo(); const devolucoes = r2(devs.reduce((s, d) => s + d.total, 0));

    statusOS() { return STATUS_OS; },

    totalOS(f) { const sub = (f.itens || []).reduce((s, i) => s + num(i.qtd) * num(i.preco), 0); return r2(sub - num(f.desconto)); },
    async salvarOS(fechar = true) {

    /* Agenda: horários locais e serviços copiados para preservar o combinado. */

    // Grade das 07:00 às 22:00; estica só para mostrar atendimento do dia fora dessa faixa.
    horariosAgenda() {
      const passo = [15,30,60].includes(Number(this.cfg.intervaloAgenda)) ? Number(this.cfg.intervaloAgenda) : 30;
      let ini = 7*60, fim = 22*60;
      for (const a of this.agendaDia()) { const m = this.minutosHora(a.hora); if (Number.isFinite(m)) { ini = Math.min(ini, m); fim = Math.max(fim, m + (Number(a.duracaoMin) || 0)); } }

    agendaDia() { return this.agenda.filter(a => a.data === this.diaAgenda).sort((a,b) => a.hora.localeCompare(b.hora)); },

    horarioOcupado(h, profissional) { const n=this.minutosHora(h); return this.agendaDia().some(a => a.profissional===profissional && !['cancelado','faltou'].includes(a.status) && this.minutosHora(a.hora)<n && this.minutosHora(a.hora)+a.duracaoMin>n); },

    },
    addServicoAgenda() { const p=this.servicosAgenda().find(p=>String(p.id)===String(this.form.servicoId)); if(!p)return; this.form.servicos.push({produtoId:p.id,nome:p.nome,preco:p.preco,duracaoMin:Number(p.duracaoMin)||30}); this.form.duracaoMin=this.form.servicos.reduce((s,i)=>s+i.duracaoMin,0); this.form.servicoId=''; },
    removerServicoAgenda(i) { this.form.servicos.splice(i,1); this.form.duracaoMin=this.form.servicos.reduce((s,i)=>s+i.duracaoMin,0)||30; },
    async salvarAgenda(confirmado=false) {

      const dados={id:f.id||this.proximo('agenda'),data:f.data,hora:f.hora,duracaoMin:duracao,clienteId:cliente.id,profissional:f.profissional,servicos:f.servicos.map(s=>({produtoId:s.produtoId,nome:s.nome,preco:num(s.preco),duracaoMin:num(s.duracaoMin)})),status:f.status,obs:f.obs||'',vendaId:null};

    },
    lembreteAgenda(a) { const c=this.cliente(a.clienteId); return c ? this.whats(c.telefone,'Olá '+c.nome+'! Confirmando seu horário '+this.data(a.data)+' às '+a.hora+' com '+a.profissional+' na '+this.cfg.empresa.nome+'.') : '#'; },

    /* ─────────── mesas e delivery ─────────── */

    /* ─────────── confirmações e senha ─────────── */
    pedirConfirmacao(texto, acao, exigeSenha) { this.confirmacao = { texto, acao, senha: !!(exigeSenha && this.cfg.senhaAdmin) }; this.senhaDigitada = ''; },

      const c = this.cliente(v.clienteId);
      let h = this.cabecalhoCupom() + '<div class="c b">CUPOM NÃO FISCAL</div><div>Venda nº ' + v.numero + ' — ' + this.dataHora(v.data) + '</div>' + (c ? '<div>Cliente: ' + esc(c.nome) + '</div>' : '') + (v.vendedor ? '<div>Vendedor: ' + esc(v.vendedor) + '</div>' : '') + (v.obs ? '<div>' + esc(v.obs) + '</div>' : '') + '<hr><table>';
      for (const i of v.itens) h += '<tr><td colspan="2">' + esc(i.nome) + '</td></tr><tr><td>' + this.qtd(i.qtd) + ' ' + esc(i.unidade || 'un') + ' x ' + this.n2(i.preco) + '</td><td class="r">' + this.n2(i.qtd * i.preco) + '</td></tr>';
      h += '</table><hr><table><tr><td>Subtotal</td><td class="r">' + this.n2(v.subtotal) + '</td></tr>' + (v.desconto ? '<tr><td>Desconto</td><td class="r">-' + this.n2(v.desconto) + '</td></tr>' : '') + (v.acrescimo ? '<tr><td>' + esc(v.acrescimoRotulo || 'Acréscimo') + '</td><td class="r">' + this.n2(v.acrescimo) + '</td></tr>' : '') + '<tr class="b g"><td>TOTAL</td><td class="r">' + this.brl(v.total) + '</td></tr>';
      for (const p of v.pagamentos) h += '<tr><td>' + esc(this.nomeForma(p.forma)) + (p.parcelas > 1 ? ' (' + p.parcelas + 'x)' : '') + '</td><td class="r">' + this.n2(p.valor) + '</td></tr>';
      if (v.troco) h += '<tr><td>Troco</td><td class="r">' + this.n2(v.troco) + '</td></tr>';
      h += '</table><hr><div class="c">' + esc(this.cfg.impressao.rodape) + '</div><div class="c" style="font-size:.8em;margin-top:4px">Documento sem valor fiscal · ' + esc(this.nomeSistema()) + '</div>';
      this.imprimir(h);
    },
    imprimirCarne(v) {
      v = v || this.ultimaVenda; const ps = this.contas.filter(c => c.vendaId === v.id && c.tipo === 'receber'); if (!ps.length) return;
      const c = this.cliente(v.clienteId) || {}; const e = this.cfg.empresa;
      let h = '';
      for (const p of ps) h += '<div class="box"><div class="cols"><div><div class="b">' + esc(e.nome) + '</div><div>Cliente: ' + esc(c.nome || '') + '</div><div>Venda nº ' + v.numero + ' — Parcela ' + p.parcela + '</div></div><div class="r"><div>Vencimento: <b>' + this.data(p.vencimento) + '</b></div><div class="g b">' + this.brl(p.valor) + '</div></div></div><div style="margin-top:18px">Pago em ____/____/______ &nbsp; Assinatura: ______________________</div></div>';
      this.imprimir('<h1>Carnê de pagamento</h1>' + h, 'A4');
    },
    imprimirRecibo(conta) {
      const c = this.cliente(conta.clienteId) || {};
      const h = this.cabecalhoCupom() + '<div class="c b">RECIBO</div><p>Recebemos de <b>' + esc(c.nome || '—') + '</b> a quantia de <b>' + this.brl(conta.valorPago) + '</b> referente a ' + esc(conta.descricao) + ', pago em ' + esc(this.nomeForma(conta.forma)) + '.</p><p>' + this.dataHora(conta.pagoEm) + '</p><div class="ass">' + esc(this.cfg.empresa.nome) + '</div>';
      this.imprimir(h);
    },
    imprimirFechamento(cx) {
      const r = cx.resumo || this.resumoCaixa(cx);
      let h = this.cabecalhoCupom() + '<div class="c b">FECHAMENTO DE CAIXA</div><div>Aberto: ' + this.dataHora(cx.abertura) + '</div><div>Fechado: ' + this.dataHora(cx.fechamento) + '</div>' + (cx.operador ? '<div>Operador: ' + esc(cx.operador) + '</div>' : '') + '<hr><table><tr><td>Vendas</td><td class="r">' + r.vendas + '</td></tr><tr class="b"><td>Total vendido</td><td class="r">' + this.n2(r.total) + '</td></tr>';
      for (const [f, v] of Object.entries(r.porForma)) h += '<tr><td>' + esc(this.nomeForma(f)) + '</td><td class="r">' + this.n2(v) + '</td></tr>';
      h += '</table><hr><table><tr><td>Fundo de troco</td><td class="r">' + this.n2(cx.valorInicial) + '</td></tr><tr><td>Recebimentos (dinheiro)</td><td class="r">' + this.n2(r.recebDinheiro) + '</td></tr><tr><td>Reforços</td><td class="r">' + this.n2(r.reforcos) + '</td></tr><tr><td>Sangrias</td><td class="r">-' + this.n2(r.sangrias) + '</td></tr><tr><td>Contas pagas (dinheiro)</td><td class="r">-' + this.n2(r.pagasDinheiro) + '</td></tr><tr class="b"><td>Esperado em dinheiro</td><td class="r">' + this.n2(r.esperadoDinheiro) + '</td></tr><tr><td>Contado</td><td class="r">' + this.n2(cx.valorContado) + '</td></tr><tr class="b"><td>Diferença</td><td class="r">' + this.n2(cx.valorContado - r.esperadoDinheiro) + '</td></tr></table>';
      this.imprimir(h);
    },
    imprimirCozinha(c, itens) {
      let h = '<div class="c b g">' + (c.tipo === 'mesa' ? 'MESA ' + c.mesa : (c.tipo === 'delivery' ? 'DELIVERY nº ' + c.numero : 'BALCÃO nº ' + c.numero)) + '</div><div class="c">' + this.dataHora(agoraISO()) + '</div><hr>';
      for (const i of itens) h += '<div class="b g">' + this.qtd(i.qtd) + 'x ' + esc(i.nome) + '</div>' + (i.obs ? '<div>  → ' + esc(i.obs) + '</div>' : '');
      if (c.tipo === 'delivery') h += '<hr><div>' + esc(c.cliente || '') + ' ' + esc(c.telefone || '') + '</div><div>' + esc(c.endereco || '') + '</div>';
      this.imprimir(h);
    },
    imprimirComanda(c) {
      c = c || this.comandaAtual; if (!c) return;
      let h = this.cabecalhoCupom() + '<div class="c b">' + (c.tipo === 'mesa' ? 'CONTA — MESA ' + c.mesa : 'PEDIDO nº ' + c.numero) + '</div><div>' + this.dataHora(agoraISO()) + '</div><hr><table>';
      for (const i of c.itens) h += '<tr><td>' + this.qtd(i.qtd) + 'x ' + esc(i.nome) + '</td><td class="r">' + this.n2(i.qtd * i.preco) + '</td></tr>';
      const t = this.totalComanda(c); h += '</table><hr><table><tr><td>Subtotal</td><td class="r">' + this.n2(t) + '</td></tr>';
      if (c.tipo === 'mesa' && this.cfg.taxaServico > 0) { const s = r2(t * this.cfg.taxaServico / 100); h += '<tr><td>Serviço (' + this.cfg.taxaServico + '%) opcional</td><td class="r">' + this.n2(s) + '</td></tr><tr class="b g"><td>TOTAL</td><td class="r">' + this.brl(t + s) + '</td></tr>'; }
      else if (c.tipo === 'delivery') { const te = num(c.taxaEntrega); h += '<tr><td>Entrega</td><td class="r">' + this.n2(te) + '</td></tr><tr class="b g"><td>TOTAL</td><td class="r">' + this.brl(t + te) + '</td></tr>'; }
      else h += '<tr class="b g"><td>TOTAL</td><td class="r">' + this.brl(t) + '</td></tr>';
      h += '</table>' + (c.tipo === 'delivery' ? '<hr><div>' + esc(c.cliente || '') + ' — ' + esc(c.telefone || '') + '</div><div>' + esc(c.endereco || '') + '</div>' : '') + '<hr><div class="c">Documento sem valor fiscal</div>';
      this.imprimir(h);
    },
    imprimirOS(o) {
      const c = this.cliente(o.clienteId) || {}; const r = this.ramo(); const e = this.cfg.empresa; const a4 = this.largura() === 'A4';
      const obj = r.os === 'veiculo'
        ? '<tr><td><b>Veículo:</b> ' + esc(o.veiculo.modelo) + '</td><td><b>Placa:</b> ' + esc(o.veiculo.placa) + '</td></tr><tr><td><b>Ano/Cor:</b> ' + esc(o.veiculo.ano) + ' ' + esc(o.veiculo.cor || '') + '</td><td><b>KM:</b> ' + esc(o.veiculo.km) + '</td></tr>'
        : '<tr><td><b>Equipamento:</b> ' + esc([o.equipamento.tipo, o.equipamento.marca, o.equipamento.modelo].filter(Boolean).join(' ')) + '</td><td><b>Nº de série/IMEI:</b> ' + esc(o.equipamento.serie) + '</td></tr><tr><td colspan="2"><b>Acessórios deixados:</b> ' + esc(o.equipamento.acessorios || 'nenhum') + '</td></tr>';
      let h = (a4 ? '<div class="cols"><div>' + (e.logo ? '<img src="' + e.logo + '" style="max-height:60px">' : '') + '<h1>' + esc(e.nome) + '</h1><div>' + esc(e.endereco || '') + ' ' + esc(e.cidade || '') + '</div><div>' + esc(e.telefone || '') + ' ' + (e.doc ? '— ' + esc(e.doc) : '') + '</div></div><div class="r"><h1>OS nº ' + o.numero + '</h1><div>Entrada: ' + this.dataHora(o.data) + '</div>' + (o.previsao ? '<div>Previsão: ' + this.data(o.previsao) + '</div>' : '') + '<div>Situação: <b>' + esc(o.status) + '</b></div></div></div><hr>' : this.cabecalhoCupom() + '<div class="c b g">OS nº ' + o.numero + '</div><div>' + this.dataHora(o.data) + ' — ' + esc(o.status) + '</div><hr>') +
        '<table><tr><td><b>Cliente:</b> ' + esc(c.nome || '') + '</td><td><b>Telefone:</b> ' + esc(c.telefone || '') + '</td></tr>' + obj + '</table>' +
        '<h2>Defeito relatado</h2><div>' + esc(o.defeito || '—') + '</div>' + (o.diagnostico ? '<h2>Diagnóstico / serviço</h2><div>' + esc(o.diagnostico) + '</div>' : '');
      if (o.itens.length) { h += '<h2>Peças e serviços</h2><table><tr><th>Descrição</th><th class="r">Qtd</th><th class="r">Unit.</th><th class="r">Total</th></tr>'; for (const i of o.itens) h += '<tr><td>' + esc(i.nome) + '</td><td class="r">' + this.qtd(i.qtd) + '</td><td class="r">' + this.n2(i.preco) + '</td><td class="r">' + this.n2(i.qtd * i.preco) + '</td></tr>'; h += '</table>' + (o.desconto ? '<div class="r">Desconto: -' + this.n2(o.desconto) + '</div>' : '') + '<div class="r b g">Total: ' + this.brl(o.total) + '</div>'; }
      if (o.garantiaDias) h += '<div><b>Garantia:</b> ' + o.garantiaDias + ' dias a partir da entrega.</div>';
      h += '<h2>Termos</h2><div style="font-size:.9em">' + esc(this.cfg.termoOS) + '</div><div class="cols"><div class="ass">' + esc(c.nome || 'Cliente') + '</div><div class="ass">' + esc(e.nome) + '</div></div>';
      this.imprimir(h);
    },
  };
}

function addDias(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

</script>
<script>
function BCabrirManual(event){event.preventDefault();const w=window.open('','_blank');if(w){w.document.open();w.document.write("<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Manual — Balcão Certo<\/title><style>\n:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172b3a;font:18px/1.65 system-ui,sans-serif}header,nav,main{max-width:960px;margin:auto;padding:24px}header{padding-top:48px}h1{font-size:40px;line-height:1.15}h2{font-size:28px;line-height:1.2}nav{display:flex;flex-wrap:wrap;gap:8px}a{color:#08675c}nav a{background:white;border:1px solid #cfdbdc;border-radius:6px;padding:6px 12px;font-size:14px}section{background:white;padding:36px;margin:0 0 24px;border-radius:12px;scroll-margin-top:20px}.kicker{font-size:12px;font-weight:700;color:#087c6c;letter-spacing:2px}aside{padding:18px;background:#edf6f4;border-left:4px solid #087c6c}footer{font-size:12px;color:#586878;margin-top:36px}@media(max-width:600px){header,nav,main{padding:16px}section{padding:22px}h1{font-size:32px}}@page{size:A4;margin:18mm}@media print{body{background:white;font-size:12pt}header,nav{display:none}main{padding:0}section{border-radius:0;padding:0;break-after:page;margin:0}section:last-child{break-after:auto}aside{background:white}h2{font-size:24pt}footer{margin-top:24mm}}\n<\/style><\/head><body><header><p>BALCÃO CERTO · VERSÃO 1.0<\/p><h1>Do primeiro cadastro ao fechamento do dia.<\/h1><p>Manual rápido para consultar durante o atendimento.<\/p><a href=\"#\" onclick=\"window.close();return false\">Abrir o sistema<\/a><\/header><nav aria-label=\"Telas do manual\"><a href=\"#salao\">Agenda do salão<\/a><a href=\"#s0\">Primeiro acesso<\/a> <a href=\"#s1\">Início<\/a> <a href=\"#s2\">Produtos e estoque<\/a> <a href=\"#s3\">Clientes<\/a> <a href=\"#s4\">Fornecedores<\/a> <a href=\"#s5\">Vender (PDV)<\/a> <a href=\"#s6\">Crediário e carnê<\/a> <a href=\"#s7\">Caixa<\/a> <a href=\"#s8\">Financeiro<\/a> <a href=\"#s9\">Vendas realizadas<\/a> <a href=\"#s10\">Relatórios<\/a> <a href=\"#s11\">Ordens de serviço<\/a> <a href=\"#s12\">Mesas e delivery<\/a> <a href=\"#s13\">Configurações e impressão<\/a> <a href=\"#s14\">Backup e recuperação<\/a> <a href=\"#s15\">Ajuda<\/a><\/nav><main><section id=\"s0\"><span class=\"kicker\">GUIA 01<\/span><h2>Primeiro acesso<\/h2><p>Abra o link do sistema no navegador do computador ou do celular. Clique em “Já comprei e tenho o código de ativação”, informe o nome da empresa e cole o código: o sistema já abre no seu tipo de negócio. Sem código, o modo demonstração permite até 20 produtos e 30 vendas.<\/p><aside>Use sempre o mesmo navegador em cada aparelho: os dados ficam guardados nele, e o que é lançado no computador não aparece no celular. Antes de trocar de navegador ou de aparelho, exporte um backup.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 1/16<\/footer><\/section><section id=\"s1\"><span class=\"kicker\">GUIA 02<\/span><h2>Início<\/h2><p>Consulte os indicadores e os avisos apresentados. Use o menu para abrir Vender, Produtos, Caixa ou Financeiro. O ramo selecionado define os módulos visíveis.<\/p><aside>Os indicadores dependem dos registros feitos. Confira o período e os custos cadastrados antes de tomar decisões.<\/aside><footer>Balcão Certo · Manual da versão 1.0 · 2/16<\/footer><\/section><section id=\"s2\"><span class=\"kicker\">GUIA 03<\/span><h2>Produtos e estoque<\/h2><p>Abra Produtos e estoque (ou Peças, produtos e serviços) e escolha Novo produto. Preencha nome, custo, preço, código de barras e estoque. Para serviços, selecione o tipo correspondente. Em roupas, crie tamanhos e cores e confira o estoque de cada variação.<\/p><aside>Para corrigir quantidades, use o ajuste de estoque. A importação de CSV precisa de colunas de nome e valores conferidos; valide com poucos itens antes de importar a lista completa. O XML de compra deve ser revisado antes de confirmar e não
